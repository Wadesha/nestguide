<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初生宝典 NestGuide - 新手父母引导工具</title>
<style>
  :root {
    --rose: #E8A0B4; --rose-light: #FDF2F5; --rose-dark: #C4708A;
    --sage: #B5C9B7; --sage-light: #F0F5F0; --sage-dark: #8DAF90;
    --cream: #FFFBF5; --text: #3D2C2E; --text-light: #7A6A6C;
    --white: #FFFFFF; --shadow: 0 2px 12px rgba(61,44,46,0.08);
    --radius: 16px; --radius-sm: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--cream); color: var(--text); line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: linear-gradient(135deg, var(--rose) 0%, var(--sage) 100%);
    color: var(--white); text-align: center; padding: 48px 20px 36px;
    position: relative; overflow: hidden;
  }
  header::before {
    content: ''; position: absolute; top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 70%, rgba(255,255,255,0.12) 0%, transparent 60%);
    pointer-events: none;
  }
  header h1 { font-size: 2.2rem; font-weight: 700; position: relative; }
  header h1 small { font-size: 0.85rem; font-weight: 400; opacity: 0.85; display: block; margin-top: 4px; }
  header p { margin-top: 12px; font-size: 1rem; opacity: 0.9; position: relative; }

  .container { max-width: 780px; margin: 0 auto; padding: 0 16px; }
  section { padding: 36px 0; }

  .due-date-section { margin-top: -20px; position: relative; z-index: 2; }
  .due-date-card {
    background: var(--white); border-radius: var(--radius);
    box-shadow: 0 4px 20px rgba(61,44,46,0.12); padding: 24px 28px;
  }
  .due-date-row { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .due-date-row label { font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 6px; }
  .due-date-row input[type="date"] {
    padding: 10px 14px; border: 2px solid #E8E0DC; border-radius: var(--radius-sm);
    font-size: 1rem; outline: none; transition: border-color 0.2s;
    background: var(--cream); min-width: 180px;
  }
  .due-date-row input[type="date"]:focus { border-color: var(--rose); }
  .due-date-row .btn {
    padding: 10px 28px; border: none; border-radius: 24px;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
    background: linear-gradient(135deg, var(--rose), var(--sage));
    color: var(--white); transition: transform 0.2s; white-space: nowrap;
  }
  .due-date-row .btn:hover { transform: scale(1.03); }
  .due-date-row .btn-outline {
    background: transparent; border: 2px solid var(--rose); color: var(--rose-dark);
    padding: 8px 20px; border-radius: 24px; font-size: 0.85rem;
    cursor: pointer; transition: all 0.2s; margin-left: 8px;
  }
  .due-date-row .btn-outline:hover { background: var(--rose-light); }

  .stage-banner {
    margin-top: 18px;
    background: linear-gradient(135deg, var(--rose-light), var(--sage-light));
    border-radius: var(--radius-sm); padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
  }
  .stage-banner .stage-name { font-size: 1.1rem; font-weight: 700; }
  .stage-banner .stage-detail { font-size: 0.85rem; color: var(--text-light); }
  .stage-banner .stage-progress { font-size: 0.9rem; font-weight: 600; color: var(--rose-dark); }

  .overall-progress {
    background: var(--white); border-radius: var(--radius-sm);
    padding: 18px 20px; margin-top: 18px;
    box-shadow: var(--shadow);
  }
  .overall-progress .stat-row {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .overall-progress .stat-item { text-align: center; flex: 1; min-width: 80px; }
  .overall-progress .stat-num { font-size: 1.4rem; font-weight: 700; color: var(--rose-dark); }
  .overall-progress .stat-label { font-size: 0.75rem; color: var(--text-light); }

  .task-group { margin-bottom: 24px; }
  .task-group-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  .task-group-header .week-label { font-size: 1rem; font-weight: 700; }
  .task-group-header .week-status {
    font-size: 0.75rem; color: var(--text-light);
    background: var(--sage-light); padding: 2px 10px; border-radius: 10px;
  }
  .task-group-header .week-status.current { background: #FDF2F5; color: var(--rose-dark); font-weight: 600; }
  .task-group-header .week-progress { margin-left: auto; font-size: 0.8rem; color: var(--text-light); }
  .task-group-header .week-icon { font-size: 1.1rem; }

  .task-card {
    background: var(--white); border-radius: var(--radius-sm);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .task-item {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 12px 18px; cursor: pointer;
    transition: background 0.15s; border-bottom: 1px solid rgba(0,0,0,0.04);
  }
  .task-item:last-child { border-bottom: none; }
  .task-item:hover { background: var(--sage-light); }
  .task-item.done { opacity: 0.5; }
  .task-item.done .task-text { text-decoration: line-through; }

  .task-check {
    width: 20px; height: 20px; border: 2px solid var(--rose);
    border-radius: 5px; flex-shrink: 0; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; font-size: 12px; color: transparent;
  }
  .task-item.done .task-check { background: var(--rose); border-color: var(--rose); color: var(--white); }

  .task-content { flex: 1; min-width: 0; }
  .task-text { font-size: 0.9rem; font-weight: 500; }
  .task-desc { font-size: 0.78rem; color: var(--text-light); margin-top: 1px; }
  .task-tag {
    flex-shrink: 0; font-size: 0.65rem; padding: 2px 8px;
    border-radius: 8px; white-space: nowrap;
  }
  .task-tag.prep { background: #FDF2F5; color: var(--rose-dark); }
  .task-tag.baby { background: #E8F4FD; color: #2C7BB6; }
  .task-tag.mom { background: #FFF8E8; color: #B8860B; }
  .task-tag.urgent { background: #FDE8E8; color: #C0392B; }
  .task-tag.doc { background: #F0F5F0; color: var(--sage-dark); }
  .task-tag.skill { background: #EDE8F5; color: #6B4C9A; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
  .empty-state h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }
  .empty-state p { font-size: 0.9rem; }

  footer { text-align: center; padding: 30px 20px; color: var(--text-light); font-size: 0.8rem; border-top: 1px solid rgba(0,0,0,0.06); }
  footer a { color: var(--rose-dark); text-decoration: none; }

  @media (max-width: 480px) {
    header h1 { font-size: 1.6rem; }
    .due-date-card { padding: 18px; }
    .due-date-row { flex-direction: column; align-items: stretch; }
    .due-date-row input[type="date"] { width: 100%; }
    .task-item { padding: 10px 14px; }
    .overall-progress .stat-item { min-width: 60px; }
  }
</style>
</head>
<body>

<header>
  <h1>初生宝典<small>NestGuide</small></h1>
  <p>设置预产期，自动生成从孕晚期到产后 3 个月的完整待办清单</p>
</header>

<div class="container">

  <section class="due-date-section">
    <div class="due-date-card">
      <div class="due-date-row">
        <div>
          <label for="due-date"> 预产期（或宝宝出生日）</label>
          <input type="date" id="due-date">
        </div>
        <button class="btn" id="set-date-btn"> 开始规划</button>
        <button class="btn-outline" id="reset-btn">重置</button>
      </div>
      <div class="stage-banner" id="stage-banner" style="display:none">
        <div>
          <div class="stage-name" id="stage-name"></div>
          <div class="stage-detail" id="stage-detail"></div>
        </div>
        <div class="stage-progress" id="stage-progress"></div>
      </div>
      <div class="overall-progress" id="overall-progress" style="display:none">
        <div class="stat-row">
          <div class="stat-item"><div class="stat-num" id="stat-total">0</div><div class="stat-label">总任务</div></div>
          <div class="stat-item"><div class="stat-num" id="stat-done">0</div><div class="stat-label">已完成</div></div>
          <div class="stat-item"><div class="stat-num" id="stat-pending">0</div><div class="stat-label">待完成</div></div>
          <div class="stat-item"><div class="stat-num" id="stat-rate">0%</div><div class="stat-label">完成率</div></div>
          <div class="stat-item"><div class="stat-num" id="stat-weeks">0</div><div class="stat-label">覆盖周数</div></div>
        </div>
      </div>
    </div>
  </section>

  <section id="task-section" style="display:none">
    <div id="task-container"></div>
  </section>

  <section id="empty-section">
    <div class="empty-state">
      <div class="icon"> </div>
      <h3>请设置您的预产期</h3>
      <p>选择日期后，系统会根据您当前所处的阶段<br>展示从孕 28 周到产后 12 周的完整待办清单</p>
      <p style="margin-top:12px;font-size:0.8rem;color:var(--rose-dark)"> 每周 4-6 项任务，轻松跟上节奏</p>
    </div>
  </section>

</div>

<footer>
  <a href="https://github.com/Wadesha/nestguide">初生宝典 NestGuide</a> · 仅供参考，不构成医疗建议
</footer>

<script>
(function() {
  // ═══════════════════════════════════════════════════
  //  任务数据库：按周负载均衡（200+ 项）
  //  week: 负数 = 产前，0 = 预产期，正数 = 产后
  //  每周 4-6 项任务，涵盖物品准备、技能学习、医疗事项
  // ═══════════════════════════════════════════════════
  const TASK_DB = [
    // ═══ 孕 28 周（week -12）═══
    { week: -12, text: '开始数胎动（每天早中晚各1次）', desc: '每天固定早、中、晚各1小时，左侧卧位或静坐。正常：≥30次/12小时或≥10次/2小时。＜10次/12小时立即就医', tag: ' 技能学习', tagClass: 'skill' },
    { week: -12, text: '预约28周产检（糖耐量OGTT）', desc: '需空腹8-12小时，提前开好检查单。75g葡萄糖耐量试验，空腹＜5.1、1h＜10.0、2h＜8.5 mmol/L', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -12, text: '开始每周称体重', desc: '每周固定时间称重，孕晚期每周增长≤500g。一周增重超过1kg需警惕妊娠高血压风险', tag: ' 知识学习', tagClass: 'mom' },
    { week: -12, text: '准备孕妇装和哺乳内衣', desc: '买2-3件无钢圈哺乳内衣、2套哺乳睡衣（前开扣）、托腹带、宽松外裤', tag: ' 物品准备', tagClass: 'prep' },
    { week: -12, text: '了解孕晚期营养补充要点', desc: '每天补钙1000mg（牛奶500ml+钙片）、铁27mg（红肉/动物肝脏/铁剂）、DHA 200mg、蛋白质75-100g', tag: ' 知识学习', tagClass: 'mom' },
    { week: -12, text: '拍照记录孕肚', desc: '每周拍一次孕肚照留念，记录体重和腹围变化', tag: ' 知识学习', tagClass: 'mom' },
    { week: -12, text: '了解孕晚期身体变化', desc: '28周后子宫底高度27-32cm，可能经历：腰酸背痛、胃灼热、气短、水肿、Braxton Hicks假性宫缩。注意区分假性宫缩和真宫缩', tag: ' 知识学习', tagClass: 'mom' },
    { week: -12, text: '做5分钟正念呼吸练习', desc: '每天花5分钟做正念呼吸：静坐闭眼，深呼吸专注于当下。告诉自己"我和宝宝都很安全"，减轻焦虑', tag: ' 技能学习', tagClass: 'mom' },
    { week: -12, text: '了解28周胎儿发育情况', desc: '28周胎儿体重约1000g，身长约35cm，眼睛能睁开闭合，能感知光线变化，大脑快速发育', tag: ' 知识学习', tagClass: 'mom' },
    { week: -12, text: '预约28周小排畸B超', desc: '28周小排畸B超检查胎儿各器官系统发育情况，筛查结构畸形，是孕晚期重要排畸检查', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -12, text: '区分假性宫缩和真宫缩', desc: '假性宫缩不规律无痛感，改变姿势会消失。真宫缩5-1-1法则：每5分钟一次持续1分钟连续1小时', tag: ' 技能学习', tagClass: 'mom' },
    { week: -12, text: '准爸爸参与孕晚期产检', desc: '准爸爸陪妻子产检，学习按摩技巧缓解腰背酸痛，了解待产物品清单，准备开始采购', tag: ' 知识学习', tagClass: 'mom' },
    { week: -12, text: '孕晚期每天饮水1.5-2L', desc: '每天饮水1.5-2L预防便秘和尿路感染，少量多次饮用，避免一次喝太多加重水肿', tag: ' 知识学习', tagClass: 'mom' },
    { week: -12, text: '认识妊娠期高血压症状', desc: '留意头痛、视力模糊、上腹疼痛、恶心呕吐等高血压症状，血压＞140/90需立即就医', tag: ' 知识学习', tagClass: 'urgent' },

    // ═══ 孕 29 周（week -11）═══
    { week: -11, text: '学习新生儿护理基础知识', desc: '了解黄疸（生理性：2-3天出现，7-10天消退；病理性：24h内出现或超2周不退需就医）、脐带护理（保持干燥，用碘伏从根部向外消毒）、吐奶处理（侧卧拍背）', tag: ' 技能学习', tagClass: 'skill' },
    { week: -11, text: '准备体重秤和血压计', desc: '每周自测体重和血压，监控妊娠高血压风险。血压＞140/90mmHg需立即就医', tag: ' 物品准备', tagClass: 'prep' },
    { week: -11, text: '学习缓解腰酸背痛的方法', desc: '站立时挺直肩膀向后，睡觉时左侧卧屈膝，使用孕妇枕。每天散步30分钟，做孕妇瑜伽', tag: ' 技能学习', tagClass: 'mom' },
    { week: -11, text: '了解顺产和剖腹产的区别', desc: '顺产：恢复快，产程12-18小时，可申请无痛（开1-2指）。剖腹产：手术约1小时，恢复较慢，需住院3-5天', tag: ' 知识学习', tagClass: 'mom' },
    { week: -11, text: '准备出生证明办理材料', desc: '提前想好宝宝名字（男女各备选），准备双方身份证原件+复印件、户口本、结婚证', tag: ' 物品准备', tagClass: 'prep' },
    { week: -11, text: '每天散步30分钟，改善睡眠质量', desc: '晚餐后散步半小时，睡前侧卧伸展腿部和背部，睡前1小时不玩手机，做5-10分钟腹式呼吸', tag: ' 技能学习', tagClass: 'mom' },
    { week: -11, text: '多听大自然的声音放松心情', desc: '周末去公园或海边散步，让宝宝感受大自然的声音，拓展听觉经验。孕妈也可以放松身心', tag: ' 知识学习', tagClass: 'mom' },
    { week: -11, text: '了解29周胎儿发育情况', desc: '29周胎儿体重约1100g，身长约37cm，能分辨明暗光线，听觉系统基本发育完成，对声音有反应', tag: ' 知识学习', tagClass: 'mom' },
    { week: -11, text: '准备孕妇心脏超声检查', desc: '30周左右做孕妇心脏超声+血清总胆汁酸检测，排查妊娠期心脏病和妊娠期肝内胆汁淤积症', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -11, text: '学习预防早产相关知识', desc: '早产信号：规律宫缩、下腹坠胀、腰酸、阴道出血、异常分泌物，出现以上任一症状立即就医', tag: ' 知识学习', tagClass: 'urgent' },
    { week: -11, text: '准爸爸学习拉玛泽呼吸法', desc: '准爸爸一起学习和练习拉玛泽呼吸法，分娩时能提醒妻子正确呼吸，做好产程配合准备', tag: ' 技能学习', tagClass: 'mom' },
    { week: -11, text: '孕晚期左侧卧睡姿', desc: '孕晚期建议左侧卧位，减轻子宫对下腔静脉压迫，改善胎盘血液循环，双腿间夹枕头更舒适', tag: ' 知识学习', tagClass: 'mom' },
    { week: -11, text: '了解孕晚期下肢水肿缓解', desc: '抬高双脚高于心脏水平，避免久站久坐，穿宽松鞋袜，限制盐摄入，严重水肿需就医排查', tag: ' 知识学习', tagClass: 'mom' },

    // ═══ 孕 30 周（week -10）═══
    { week: -10, text: '了解待产包完整清单', desc: '分三大类：妈妈篇（产褥垫20片/安心裤/哺乳内衣/吸管杯）、宝宝篇（NB尿不湿/衣服/包被/奶粉）、证件篇（身份证/医保卡/产检手册）', tag: ' 物品准备', tagClass: 'prep' },
    { week: -10, text: '报名孕妇学校课程', desc: '学习分娩过程、拉玛泽呼吸法、产后护理、新生儿护理、母乳喂养技巧', tag: ' 技能学习', tagClass: 'skill' },
    { week: -10, text: '准备新生儿衣物和包被', desc: '买3-5套52/59码连体衣（A类标准，无骨缝制）、2条包被（根据季节选厚度）、2顶胎帽、3双袜子', tag: ' 物品准备', tagClass: 'baby' },
    { week: -10, text: '预约30周产检', desc: '常规产检+血常规（检查是否贫血），开始每2周产检一次。注意测量骨盆条件', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -10, text: '控制盐分摄入，预防水肿加重', desc: '每天盐摄入＜6g，少吃腌制食品。晚上睡觉在脚下垫枕头，避免久站久坐，穿宽松鞋子', tag: ' 知识学习', tagClass: 'mom' },
    { week: -10, text: '少吃多餐，每天5-6餐', desc: '每2-3小时进食一次，每餐七分饱。避免胃部被过度挤压引起反流，减少血糖波动', tag: ' 知识学习', tagClass: 'mom' },
    { week: -10, text: '了解分娩减痛方法', desc: '了解拉玛泽呼吸法、水中分娩、导乐陪伴、无痛分娩（硬膜外麻醉）等减痛方式，提前选择适合自己的方案', tag: ' 知识学习', tagClass: 'mom' },
    { week: -10, text: '开始练习凯格尔运动', desc: '收缩盆底肌（像憋尿）5秒→放松10秒，每天3组每组10次。孕晚期开始练习有助于产后恢复，预防漏尿', tag: ' 技能学习', tagClass: 'mom' },
    { week: -10, text: '了解30周胎儿发育情况', desc: '30周胎儿体重约1400g，身长约38cm，大脑快速发育出现脑沟回，能区分白天和黑夜', tag: ' 知识学习', tagClass: 'mom' },
    { week: -10, text: '30周产检+孕妇心超', desc: '常规产检+孕妇心脏超声+血清总胆汁酸检测，排查妊娠期心脏病和胆汁淤积症，开始每2周产检', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -10, text: '关注妊娠期高血压风险', desc: '血压＞140/90mmHg需立即就医，留意头痛、视力模糊、上腹疼痛等高血压症状，每天自测血压', tag: ' 知识学习', tagClass: 'urgent' },
    { week: -10, text: '孕晚期补钙分次服用', desc: '每天补钙1000mg（牛奶500ml+钙片），分次服用吸收更好，避免与铁剂同服影响吸收', tag: ' 知识学习', tagClass: 'mom' },
    { week: -10, text: '孕晚期蛋白质每天75-100g', desc: '每天摄入优质蛋白75-100g，分三餐摄入，鸡蛋鱼肉瘦肉豆制品搭配，促进胎儿体重增长', tag: ' 知识学习', tagClass: 'mom' },

    // ═══ 孕 31 周（week -9）═══
    { week: -9, text: '学习新生儿喂养知识', desc: '母乳喂养：按需8-12次/天，每次15-30分钟/侧。奶粉：先水后粉（40-50℃），每3小时一次，1-2周60-90ml/次，3-4周90-120ml/次', tag: ' 技能学习', tagClass: 'skill' },
    { week: -9, text: '准备哺乳用品', desc: '哺乳内衣2-3件、防溢乳垫1盒、吸奶器（建议先租借医用级，产后确定奶量再买）、羊脂膏防乳头皲裂', tag: ' 物品准备', tagClass: 'prep' },
    { week: -9, text: '了解产后恢复基本知识', desc: '恶露变化：血性（3-4天鲜红）→浆液性（4-14天淡粉）→白色（3周后乳白），持续4-6周。伤口护理、盆底肌恢复重要性', tag: ' 知识学习', tagClass: 'mom' },
    { week: -9, text: '了解脐带绕颈基本知识', desc: '单圈绕颈很常见，通常不影响顺产。多圈绕颈医生会根据情况建议分娩方式。不要过于担心，坚持数胎动最重要', tag: ' 知识学习', tagClass: 'mom' },
    { week: -9, text: '多吃高蛋白食物促进胎儿发育', desc: '孕31周是宝宝体重快速增长期，多吃鱼肉、鸡蛋、瘦肉、豆制品，少吃甜食和精细米面', tag: ' 知识学习', tagClass: 'mom' },
    { week: -9, text: '了解妊娠期肝内胆汁淤积症（ICP）', desc: 'ICP症状：全身皮肤瘙痒（尤其手掌脚掌），夜间加重。如出现及时就医检查肝功能+总胆汁酸', tag: ' 知识学习', tagClass: 'mom' },
    { week: -9, text: '准备防妊娠纹产品', desc: '每天涂抹妊娠纹霜/油，重点涂抹腹部、大腿、臀部。保持皮肤湿润，增加弹性', tag: ' 物品准备', tagClass: 'prep' },
    { week: -9, text: '了解31周胎儿发育情况', desc: '31周胎儿体重约1500g，身长约40cm，能区分白天黑夜，开始有睡眠周期，听觉发育成熟', tag: ' 知识学习', tagClass: 'mom' },
    { week: -9, text: '妊娠期糖尿病饮食控制', desc: '少食多餐选择低GI食物，避免甜食精制碳水，监测餐后2小时血糖，控制血糖保护胎儿', tag: ' 知识学习', tagClass: 'mom' },
    { week: -9, text: '孕晚期补铁搭配维生素C', desc: '每天补充铁27mg，搭配维C（橙子/猕猴桃/番茄）促进吸收，避免与钙同服，至少间隔2小时', tag: ' 知识学习', tagClass: 'mom' },
    { week: -9, text: '准爸爸陪产准备练习', desc: '准爸爸学习产程中如何协助妻子，练习按摩手法和呼吸引导，了解三个产程的配合要点', tag: ' 技能学习', tagClass: 'mom' },
    { week: -9, text: '孕晚期少吃多餐控血糖', desc: '每天5-6餐每餐七分饱，选择低GI食物，避免血糖剧烈波动，控制体重增长', tag: ' 知识学习', tagClass: 'mom' },
    { week: -9, text: '了解孕晚期腰背疼痛缓解', desc: '站立挺直肩膀向后，睡觉左侧卧屈膝夹枕，使用孕妇枕支撑，每天散步30分钟做孕妇瑜伽', tag: ' 知识学习', tagClass: 'mom' },

    // ═══ 孕 32 周（week -8）═══
    { week: -8, text: '准备待产包（妈妈篇）', desc: '产褥垫20片（60×90cm）、安心裤/一次性内裤15条、产妇卫生巾XL码3包、吸管杯、刀纸2包、会阴冷敷贴3-5片（顺产必备）', tag: ' 物品准备', tagClass: 'prep' },
    { week: -8, text: '预约32周产检（小排畸+胎心监护）', desc: '系统超声筛查（小排畸）：检查胎儿生长发育、羊水量、脐带、胎盘。首次胎心监护（NST），检查前吃点甜食让宝宝活跃', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -8, text: '确定分娩医院并办手续', desc: '确认床位、入院流程、陪产政策、医保报销比例，交押金办住院登记。了解医院提供的待产物品', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -8, text: '准备婴儿床和床上用品', desc: '安装婴儿床（护栏间距≤6cm，无油漆味）、买硬床垫（不垫枕头）、床围、睡袋，提前通风散味', tag: ' 物品准备', tagClass: 'baby' },
    { week: -8, text: '和家人讨论分娩方式', desc: '和医生沟通顺产/剖腹产适应症，了解无痛分娩（硬膜外麻醉，开1-2指可申请，费用1000-2400元），了解导乐陪产', tag: ' 知识学习', tagClass: 'mom' },
    { week: -8, text: '准备婴儿车和安全座椅', desc: '选购适合的新生儿安全座椅（必须反向安装至2岁，ISOFIX接口），婴儿车选可平躺款（170°以上）', tag: ' 物品准备', tagClass: 'baby' },
    { week: -8, text: '安排午休时间', desc: '每天午休30-60分钟，缓解腰酸背痛，为胎宝宝输送充足养分。睡醒后侧身用手臂支撑起身，静坐1分钟后再起', tag: ' 知识学习', tagClass: 'mom' },
    { week: -8, text: '按需补铁（预防贫血）', desc: '孕晚期对铁的需求量达到高峰，贫血会增加早产风险。在医生指导下补充铁剂，同时多吃富含维C的食物促进铁吸收', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -8, text: '了解32周胎儿发育情况', desc: '32周胎儿体重约1800g，身长约41cm，骨骼系统基本形成，指甲长到指尖，胎动次数达到高峰', tag: ' 知识学习', tagClass: 'mom' },
    { week: -8, text: '32周首次胎心监护', desc: '首次胎心监护（NST）监测胎心率和宫缩，检查前吃点甜食让宝宝活跃起来，约20分钟', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -8, text: '每天练习拉玛泽呼吸法', desc: '每天练习10-15分钟拉玛泽呼吸法，准爸爸一起练习，在产程中提醒并引导妻子正确呼吸', tag: ' 技能学习', tagClass: 'skill' },
    { week: -8, text: '孕晚期便秘预防措施', desc: '每天摄入纤维30g（绿叶蔬菜+粗粮），饮水1.5-2L，适当散步促进肠道蠕动，避免久坐', tag: ' 知识学习', tagClass: 'mom' },
    { week: -8, text: '孕晚期每周体重增长≤500g', desc: '每周固定时间称体重，孕晚期每周增长≤500g，一周增重超1kg需警惕妊娠高血压', tag: ' 知识学习', tagClass: 'mom' },

    // ═══ 孕 33 周（week -7）═══
    { week: -7, text: '学习正确哺乳姿势', desc: '摇篮式（最常用，适合白天）、侧卧式（适合剖腹产/夜间喂奶）、橄榄球式（适合双胞胎/剖腹产）。核心：确保宝宝含住大部分乳晕而非只含乳头', tag: ' 技能学习', tagClass: 'skill' },
    { week: -7, text: '准备新生儿洗护用品', desc: '沐浴露（无香精、无泪配方）、润肤露（无香精）、护臀膏（含氧化锌15%+）、浴盆+浴网、水温计（37-38℃）、纱布浴巾3条、小方巾6条', tag: ' 物品准备', tagClass: 'baby' },
    { week: -7, text: '了解胎位（头位 vs 臀位）', desc: '头位（正常，可顺产）、臀位（需考虑剖腹产或外倒转术）。33周左右胎位基本固定，医生会特别关注', tag: ' 知识学习', tagClass: 'mom' },
    { week: -7, text: '预防便秘（多吃膳食纤维）', desc: '孕晚期胃肠蠕动减慢，建议每天摄入绿叶蔬菜300g+、粗粮（红薯/燕麦）、水果200g。每天饮水1.5-2L', tag: ' 知识学习', tagClass: 'mom' },
    { week: -7, text: '学习新生儿常见问题应对', desc: '肠绞痛（排气操/飞机抱/白噪音）、湿疹（保湿+避汗）、热疹（降温+干爽）、红屁屁（勤换尿不湿+护臀膏）', tag: ' 技能学习', tagClass: 'skill' },
    { week: -7, text: '了解孕期贫血症状', desc: '头晕、乏力、面色苍白、心慌气短可能是贫血表现。多吃红肉、动物肝脏、菠菜、黑木耳，配合维C水果促进铁吸收', tag: ' 知识学习', tagClass: 'mom' },
    { week: -7, text: '了解前置胎盘和高危妊娠', desc: '如28周后B超提示胎盘位置低（前置胎盘），需避免剧烈运动、禁止性生活，有出血立即就医', tag: ' 知识学习', tagClass: 'mom' },
    { week: -7, text: '了解33周胎儿发育情况', desc: '33周胎儿体重约2000g，身长约42cm，能分辨不同声音来源，对光线变化有反应，胎位渐固定', tag: ' 知识学习', tagClass: 'mom' },
    { week: -7, text: 'B超确认胎位是否头位', desc: '33周B超确认胎位，头位可顺产，臀位可咨询医生是否需要外倒转术或考虑剖腹产', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -7, text: '每天补充DHA200mg', desc: '每天补充DHA 200mg（深海鱼/藻油），促进胎儿大脑皮层和视网膜发育，孕晚期关键营养', tag: ' 知识学习', tagClass: 'mom' },
    { week: -7, text: '分娩准备心理建设', desc: '接受分娩的不确定性，写下恐惧和担忧与伴侣沟通，学习正念冥想，建立积极分娩信念', tag: ' 技能学习', tagClass: 'mom' },
    { week: -7, text: '孕晚期避免久站久坐', desc: '避免长时间站立或坐着，每隔30分钟变换姿势，抬高双脚减轻水肿，穿弹力袜预防静脉曲张', tag: ' 知识学习', tagClass: 'mom' },

    // ═══ 孕 34 周（week -6）═══
    { week: -6, text: '完成待产包（宝宝篇+证件篇）', desc: 'NB尿不湿30片（带去医院）、奶粉1小罐（400g备用）、奶瓶2个（160ml玻璃+SS奶嘴）、证件原件+复印件（身份证/医保卡/产检手册/生育服务单）、手机充电器+充电宝', tag: ' 物品准备', tagClass: 'prep' },
    { week: -6, text: '预约34周产检（B超评估胎儿体重）', desc: 'B超评估胎儿体重和胎位，检查骨盆条件。34周后医生对胎位特别关注，胎位不正需在医生指导下纠正', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -6, text: '确定陪产人并沟通分工', desc: '确定谁陪产，告诉TA：每个产程怎么配合、待产包位置、紧急联系人、产妇饮食偏好、宝宝出生后第一时间联系谁', tag: ' 知识学习', tagClass: 'mom' },
    { week: -6, text: '学习拉玛泽呼吸法', desc: '每天练习10-15分钟：廓清式呼吸（深呼吸）→胸式呼吸（加速）→喘息式呼吸（浅快）→哈气呼吸（不要用力时用）。让丈夫一起练习，产程中提醒你', tag: ' 技能学习', tagClass: 'skill' },
    { week: -6, text: '填写分娩计划书', desc: '包括疼痛管理（无痛/导乐/呼吸法）、陪产人、脐带血处理（捐赠/自存/废弃）、胎盘处理、母乳喂养意愿等', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -6, text: '避免长途旅行', desc: '34周后应避免长途旅行，出门随身携带产检手册。乘车时每30分钟起来活动脚踝，预防水肿和血栓', tag: ' 知识学习', tagClass: 'mom' },
    { week: -6, text: '了解B族链球菌（GBS）筛查', desc: '35-37周建议做GBS筛查，如阳性分娩时需用抗生素预防新生儿感染。提前了解这个检查', tag: ' 知识学习', tagClass: 'mom' },
    { week: -6, text: '拍孕妇照留念', desc: '34周左右是拍孕妇照的最佳时期，肚子够大但身体还能承受。去专业摄影棚或在家拍都行', tag: ' 知识学习', tagClass: 'mom' },
    { week: -6, text: '了解34周胎儿发育情况', desc: '34周胎儿体重约2300g，身长约44cm，皮下脂肪增多皮肤变粉红，胎毛开始脱落，头部朝下', tag: ' 知识学习', tagClass: 'mom' },
    { week: -6, text: '34周B超+胎心监护', desc: 'B超评估胎儿体重胎位羊水量胎盘成熟度，同时做胎心监护，34周后胎位基本固定', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -6, text: '每天补充优质蛋白75-100g', desc: '每天摄入优质蛋白75-100g，分餐摄入（鸡蛋/鱼肉/瘦肉/豆制品），促进胎儿体重增长', tag: ' 知识学习', tagClass: 'mom' },
    { week: -6, text: '准爸爸确认待产包物品', desc: '准爸爸确认待产包所有物品位置和用途，确保临产时能快速找到每样东西，不手忙脚乱', tag: ' 物品准备', tagClass: 'prep' },
    { week: -6, text: '了解孕晚期胃灼热缓解方法', desc: '少吃多餐避免辛辣油腻，饭后散步不立即躺下，睡觉时垫高上半身，严重时可咨询医生用药', tag: ' 知识学习', tagClass: 'mom' },

    // ═══ 孕 35 周（week -5）═══
    { week: -5, text: '安装婴儿安全座椅', desc: '安装在后排中间位置，用ISOFIX或安全带固定。去消防站或汽修店免费检查是否牢固。反向安装至2岁', tag: ' 物品准备', tagClass: 'baby' },
    { week: -5, text: '准备新生儿日常用品', desc: '婴儿指甲剪（圆头剪刀型）、棉柔巾/云柔巾（干湿两用）、湿巾（纯水无酒精）、一次性隔尿垫、电子体温计、吸鼻器', tag: ' 物品准备', tagClass: 'baby' },
    { week: -5, text: '和医生最终确定分娩计划', desc: '和医生详细讨论：顺产条件评估、剖腹产指征、无痛分娩方案、特殊情况处理预案', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -5, text: '了解新生儿疾病筛查项目', desc: '足跟血筛查（出生72小时后，查苯丙酮尿症/先天性甲减/G6PD等）、耳聋基因检测、听力筛查（出生后48小时）', tag: ' 技能学习', tagClass: 'skill' },
    { week: -5, text: '开始准备家中宝宝区域', desc: '设置换尿布台（腰部高度防腰酸）、哺乳角（舒适椅子+哺乳枕+脚凳）、宝宝睡眠区。确保室温22-26℃，湿度50-60%', tag: ' 物品准备', tagClass: 'baby' },
    { week: -5, text: '了解分娩陪产注意事项', desc: '确定陪产人（丈夫/妈妈/导乐），了解医院陪产政策。提前和陪产人沟通好产程中的配合方式', tag: ' 知识学习', tagClass: 'mom' },
    { week: -5, text: '准备住院期间洗漱用品', desc: '软毛牙刷+孕妇牙膏、漱口杯、洗脸巾、毛巾、防滑拖鞋、脸盆2-3个（洗脸/洗下身）、蒸汽眼罩、耳塞', tag: ' 物品准备', tagClass: 'prep' },
    { week: -5, text: '了解35周胎儿发育情况', desc: '35周胎儿体重约2500g，身长约45cm，肾脏发育完成能自主排尿，肺部接近成熟，胎头逐渐入盆', tag: ' 知识学习', tagClass: 'mom' },
    { week: -5, text: '了解GBS筛查重要性', desc: '35-37周做B族链球菌筛查，阳性分娩时需用抗生素预防新生儿感染，提前了解检查流程', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -5, text: '练习区分真宫缩假宫缩', desc: '假性宫缩不规律＜30秒，改变姿势即消失。真宫缩4-5分钟一次持续30-70秒逐渐加强', tag: ' 技能学习', tagClass: 'mom' },
    { week: -5, text: '了解分娩综合镇痛方案', desc: '了解硬膜外麻醉、导乐陪伴、水中分娩、呼吸减痛法等综合镇痛方案，选择适合自己的组合', tag: ' 知识学习', tagClass: 'mom' },
    { week: -5, text: '孕晚期准备哺乳枕', desc: '准备U型哺乳枕，产前可用于支撑腹部缓解腰酸，产后用于哺乳时支撑宝宝减轻手臂负担', tag: ' 物品准备', tagClass: 'prep' },
    { week: -5, text: '了解孕晚期气短缓解方法', desc: '子宫压迫膈肌导致气短，挺直坐姿深呼吸，避免弯腰驼背，睡觉时垫高上半身', tag: ' 知识学习', tagClass: 'mom' },

    // ═══ 孕 36 周（week -4）═══
    { week: -4, text: '开始每周产检（36周起每周1次）', desc: '36周起产检频率变为每周1次。每次做胎心监护（NST），监测胎心率和宫缩。检查胎位、羊水量、胎盘成熟度', tag: ' 医疗事项', tagClass: 'urgent' },
    { week: -4, text: '学习产后护理知识', desc: '顺产伤口护理：每次便后温水冲洗+碘伏消毒，勤换卫生巾，前24h冷敷后24h温水坐浴。剖腹产伤口：保持敷料干燥，2周内不沾水，咳嗽时按压伤口两侧', tag: ' 知识学习', tagClass: 'mom' },
    { week: -4, text: '确定产后照顾方案', desc: '月嫂（提前面试签约，确认档期）/月子中心（提前考察，交定金）/家人照顾（提前沟通分工，避免产后矛盾）', tag: ' 物品准备', tagClass: 'prep' },
    { week: -4, text: '买齐新生儿洗护用品', desc: '无香精沐浴露、润肤露、护臀膏（含氧化锌）、液体爽身露（不用粉末）、抚触油（无香精）', tag: ' 物品准备', tagClass: 'baby' },
    { week: -4, text: '准备好待产补给和能量零食', desc: '巧克力、功能饮料（尖叫/红牛带吸嘴）、矿泉水、吸管、小零食（饼干/坚果），放在待产包侧袋。产房用单独小包装', tag: ' 物品准备', tagClass: 'prep' },
    { week: -4, text: '行动注意安全（防滑防摔）', desc: '36周后行动更加笨拙，洗澡/上下楼梯一定要慢，地面铺防滑垫，最好有家人陪伴', tag: ' 知识学习', tagClass: 'urgent' },
    { week: -4, text: '36周产检（胎心监护+GBS筛查）', desc: '35-37周做B族链球菌（GBS）筛查，阳性需在分娩时使用抗生素预防新生儿感染。同时做胎心监护', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -4, text: '给手机充满电，下载放松App', desc: '下载呼吸练习/冥想App、宫缩计时器App。准备分娩时播放的舒缓音乐列表', tag: ' 物品准备', tagClass: 'prep' },
    { week: -4, text: '了解36周胎儿发育情况', desc: '36周胎儿体重约2700g，身长约46cm，肺部发育接近成熟，初产妇胎头入盆，呼吸更轻松', tag: ' 知识学习', tagClass: 'mom' },
    { week: -4, text: '36周GBS筛查+胎心监护', desc: '36周做B族链球菌筛查+胎心监护，确认胎心率和宫缩情况，这是产前重要检查', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -4, text: '了解分娩先兆三信号', desc: '见红（粉褐色分泌物）→破水（持续流水立即平躺垫高）→规律宫缩（5-1-1法则）→去医院', tag: ' 技能学习', tagClass: 'urgent' },
    { week: -4, text: '准爸爸安排产假时间', desc: '准爸爸提前和单位沟通陪产假安排，做好工作交接和家庭分工，确保随时可以陪产', tag: ' 知识学习', tagClass: 'mom' },
    { week: -4, text: '孕晚期准备会阴冷敷贴', desc: '顺产必备会阴冷敷贴3-5片，产后24小时内冷敷减轻肿胀和疼痛，提前放入待产包', tag: ' 物品准备', tagClass: 'prep' },

    // ═══ 孕 37 周（week -3）═══
    { week: -3, text: '待产包放门口显眼位置', desc: '拉杆箱+小包（证件类单独放小包），放在门口随时能拎走。让家人也知道位置', tag: ' 物品准备', tagClass: 'urgent' },
    { week: -3, text: '37周全面检查（评估分娩方式）', desc: 'B超检查胎盘成熟度、胎儿大小、羊水量。血液化验（血常规/肝功/凝血）。评估是否适合顺产', tag: ' 医疗事项', tagClass: 'urgent' },
    { week: -3, text: '规划去医院最佳路线和方案', desc: '提前踩点，记录高峰/平峰时间。找好停车场。备选方案：打120/出租车。准备两个方案', tag: ' 知识学习', tagClass: 'urgent' },
    { week: -3, text: '学习产兆判断方法', desc: '规律宫缩：5-1-1法则（每5分钟一次，持续1分钟，连续1小时）。破水：感觉一股暖流，平躺抬臀垫高，立即就医。见红：粉红色/褐色分泌物，不必立即去医院但需观察', tag: ' 技能学习', tagClass: 'skill' },
    { week: -3, text: '保持手机畅通，家人随时待命', desc: '37周足月后随时可能发动，确保手机24小时开机，家人能随时联系到。备好出租车/120电话', tag: ' 知识学习', tagClass: 'urgent' },
    { week: -3, text: '确认产后母乳喂养支持', desc: '了解医院是否有母乳喂养指导师、产后开奶服务、是否允许母婴同室。准备吸奶器和防溢乳垫', tag: ' 知识学习', tagClass: 'mom' },
    { week: -3, text: '37周B超检查（评估胎儿大小和胎位）', desc: 'B超检查胎盘成熟度（1-3级）、胎儿估重、羊水指数、胎位。足月后评估分娩方式', tag: ' 医疗事项', tagClass: 'urgent' },
    { week: -3, text: '了解新生儿医保办理流程', desc: '了解所在地新生儿医保政策（通常3个月内办理），准备好出生证明、户口本、照片等材料', tag: ' 知识学习', tagClass: 'baby' },
    { week: -3, text: '了解37周胎儿发育情况', desc: '37周胎儿已足月，体重约2900g，身长约47cm，肺部完全成熟，免疫系统开始建立，随时可出生', tag: ' 知识学习', tagClass: 'mom' },
    { week: -3, text: '37周足月分娩评估', desc: '全面评估胎儿大小胎位骨盆条件宫颈成熟度，医生根据评估结果确定最终分娩方式', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -3, text: '分娩心理建设正念冥想', desc: '接受分娩疼痛是自然过程，学习正念呼吸技巧，建立积极分娩信念，减少恐惧和焦虑', tag: ' 技能学习', tagClass: 'mom' },
    { week: -3, text: '准爸爸做好产前准备', desc: '准爸爸手机24小时开机，熟悉去医院路线和停车场，准备安抚妻子情绪的方法和语言', tag: ' 知识学习', tagClass: 'mom' },
    { week: -3, text: '孕晚期准备私处冲洗器', desc: '顺产必备私处冲洗器，产后每次便后用温水冲洗伤口，保持清洁预防感染，提前购买', tag: ' 物品准备', tagClass: 'prep' },

    // ═══ 孕 38 周（week -2）═══
    { week: -2, text: '确认入院流程和证件齐全', desc: '检查：身份证原件+复印件、医保卡、母子健康手册、全套产检报告、生育服务单、银行卡/现金500-1000元。全部放透明文件袋', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -2, text: '深入学习母乳喂养知识', desc: '正确衔乳：宝宝嘴张很大，含住大部分乳晕，下唇外翻。喂养频率：8-12次/天。堵奶预防：及时排空，热敷+按摩。乳头皲裂预防：正确衔乳+涂羊脂膏', tag: ' 技能学习', tagClass: 'skill' },
    { week: -2, text: '准备家中环境', desc: '彻底打扫卫生（尤其是卧室和宝宝区域），设置宝宝专属区域。备好待产零食和手机充电器', tag: ' 物品准备', tagClass: 'prep' },
    { week: -2, text: '准备紧急联系方式清单', desc: '医院电话、产科病房电话、主治医生电话、家人电话、出租车/120备选。写清楚贴冰箱上，家人都知道', tag: ' 物品准备', tagClass: 'urgent' },
    { week: -2, text: '学习新生儿疫苗接种计划', desc: '出生24h内：乙肝疫苗第一针+卡介苗。1月龄：乙肝第二针。2月龄：五联第一针/13价肺炎第一针/口服轮状第一剂。3月龄：五联第二针', tag: ' 知识学习', tagClass: 'baby' },
    { week: -2, text: '保持心情放松，吃好睡好', desc: '38周后随时可能发动，保持体力。听听音乐、和准爸爸聊天、安排好家里事务', tag: ' 知识学习', tagClass: 'mom' },
    { week: -2, text: '38周产检（胎心监护+常规检查）', desc: '监测胎心率和宫缩。常规检查：血压、体重、宫高、腹围、尿常规。这是产前关键检查', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -2, text: '了解剖腹产术前准备', desc: '如计划剖腹产：术前6-8小时禁食禁水，了解手术过程和术后注意事项。准备好收腹带', tag: ' 知识学习', tagClass: 'mom' },
    { week: -2, text: '了解38周胎儿发育情况', desc: '38周胎儿体重约3000g，身长约48cm，感官系统发育完善，能分辨不同声音和光线变化', tag: ' 知识学习', tagClass: 'mom' },
    { week: -2, text: '38周胎心监护每周一次', desc: '每周胎心监护监测胎心率和宫缩，确保胎儿宫内安全，38周后随时可能发动', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -2, text: '分娩前饮食能量储备', desc: '多吃易消化高能量食物保持体力，避免产气食物（豆类/洋葱/红薯），少量多餐', tag: ' 知识学习', tagClass: 'mom' },
    { week: -2, text: '和家人演练分娩应对流程', desc: '和家人一起演练见红、破水、规律宫缩三种情况的应对流程，确保每个人知道怎么做', tag: ' 技能学习', tagClass: 'urgent' },
    { week: -2, text: '孕晚期准备哺乳内衣防溢乳垫', desc: '准备2-3件无钢圈哺乳内衣和防溢乳垫，产后立即使用，方便哺乳预防溢奶尴尬', tag: ' 物品准备', tagClass: 'prep' },

    // ═══ 孕 39 周（week -1）═══
    { week: -1, text: '每天数胎动，密切关注产兆', desc: '每天早中晚各数1小时胎动，记录宫缩频率/破水/见红情况。任何异常立即联系医院', tag: ' 技能学习', tagClass: 'urgent' },
    { week: -1, text: '39周产检（B超检查羊水胎盘）', desc: 'B超检查胎儿发育情况、羊水量、脐带绕颈、胎盘成熟度。血常规+尿常规', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -1, text: '放松心情，适当运动助顺产', desc: '散步20分钟/天，听音乐冥想，做温和的孕妇瑜伽。保持体力，有助于顺产', tag: ' 知识学习', tagClass: 'mom' },
    { week: -1, text: '准备好产后恢复用品', desc: '收腹带（剖腹产必备，顺产产后2周后用）、哺乳枕、会阴冷敷贴、私处冲洗器（顺产必备）、一次性马桶垫10片', tag: ' 物品准备', tagClass: 'prep' },
    { week: -1, text: '和家人确认最终分工', desc: '谁负责送医、谁办手续、谁照顾产妇、谁管做饭、谁照顾宝宝、谁负责和亲友沟通。写下来贴冰箱上', tag: ' 知识学习', tagClass: 'mom' },
    { week: -1, text: '了解分娩疼痛管理方案', desc: '无痛分娩：硬膜外麻醉，费用1000-2400元，开1-2指可申请。导乐陪产：一对一全程陪伴。呼吸减痛法：拉玛泽呼吸法', tag: ' 知识学习', tagClass: 'mom' },
    { week: -1, text: '了解39周胎儿发育情况', desc: '39周胎儿体重约3200g，身长约49cm，皮肤呈粉红色覆盖胎脂，头发长1-3cm，已做好出生准备', tag: ' 知识学习', tagClass: 'mom' },
    { week: -1, text: '39周胎心监护加B超', desc: '持续每周胎心监护，B超检查羊水量和胎盘功能，确认胎儿状态良好，为分娩做好准备', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -1, text: '分娩前最后物品检查', desc: '整理好待产包，确认证件齐全，给手机充满电，备好充电宝，做好随时出发的准备', tag: ' 物品准备', tagClass: 'urgent' },
    { week: -1, text: '放松心态迎接分娩到来', desc: '听音乐冥想散步，保持心情愉悦，相信身体和医生的能力，告诉自己已经准备好了', tag: ' 知识学习', tagClass: 'mom' },
    { week: -1, text: '孕晚期准备分娩能量零食', desc: '准备巧克力、功能饮料（带吸嘴）、矿泉水、小饼干，放在待产包侧袋，产房用单独小包装', tag: ' 物品准备', tagClass: 'prep' },
    { week: -1, text: '孕晚期准备吸管杯', desc: '准备带吸管的保温杯，分娩时方便喝水补充体力，产后卧床时也能轻松使用', tag: ' 物品准备', tagClass: 'prep' },

    // ═══ 预产期 / 40 周（week 0）═══
    { week: 0, text: '出现产兆立即联系医院', desc: '规律宫缩（5分钟一次持续1小时）/ 破水（平躺抬臀垫高，立即就医）/ 见红（观察出血量）。不要犹豫，立即去医院', tag: ' 医疗事项', tagClass: 'urgent' },
    { week: 0, text: '带上待产包出发去医院', desc: '检查待产包和证件是否齐全，带手机和充电器，通知陪产人。产房包单独拎出', tag: ' 物品准备', tagClass: 'urgent' },
    { week: 0, text: '保持镇定，配合医生和助产士', desc: '用拉玛泽呼吸法缓解疼痛，按分娩计划进行。相信自己，相信医生。不要大喊大叫保存体力', tag: ' 技能学习', tagClass: 'mom' },
    { week: 0, text: '产后1小时内尽早哺乳', desc: '产后尽早让宝宝吸吮，刺激泌乳和子宫收缩。初乳（黄色粘稠）是宝宝第一剂"疫苗"，富含免疫球蛋白', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 0, text: '如40周未发动，按时产检', desc: '40周还未发动属正常现象，按时去医院做胎心监护和B超检查羊水/胎盘情况。超过41周需入院待产', tag: ' 医疗事项', tagClass: 'urgent' },
    { week: 0, text: '了解40周胎儿发育情况', desc: '40周胎儿体重约3400g，身长约50cm，胎脂减少四肢丰满，已做好出生准备，随时可能发动', tag: ' 知识学习', tagClass: 'mom' },
    { week: 0, text: '40周未发动继续监测', desc: '40周未发动属正常，继续每天数胎动，按时做胎心监护，每3天B超检查羊水是否充足', tag: ' 医疗事项', tagClass: 'urgent' },
    { week: 0, text: '产房必备物品单独准备', desc: '待产包中单独拿出产房包：产褥垫、安心裤、吸管杯、能量零食、手机充电器，方便随时拎进产房', tag: ' 物品准备', tagClass: 'prep' },
    { week: 0, text: '了解分娩三产程过程', desc: '第一产程宫口开全10cm（8-12h）→第二产程娩出胎儿（1-2h）→第三产程娩出胎盘（5-30min）', tag: ' 知识学习', tagClass: 'mom' },
    { week: 0, text: '分娩时配合助产士用力', desc: '宫缩时深吸气憋住用力像排便，宫缩间歇时放松休息，不要大喊大叫保存体力，听助产士指令', tag: ' 技能学习', tagClass: 'mom' },

    // ═══ 产后第 1 周（week 1）═══
    { week: 1, text: '产后充分休息，及早下床', desc: '产后24小时尽量卧床，让家人多分担。顺产6-12小时后可下床慢走，剖腹产24-48小时后拔尿管下床。早期下床预防血栓形成', tag: ' 知识学习', tagClass: 'mom' },
    { week: 1, text: '伤口护理（顺产/剖腹产不同）', desc: '顺产：每次便后温水冲洗+碘伏消毒，勤换卫生巾（2-3小时），前24h冷敷减轻肿胀。剖腹产：保持敷料干燥，观察红肿渗液，咳嗽时按压伤口', tag: ' 技能学习', tagClass: 'mom' },
    { week: 1, text: '学习正确哺乳姿势和衔乳', desc: '摇篮式/侧卧式/橄榄球式，确保宝宝含住大部分乳晕（不是只含乳头），听到吞咽声。喂奶后竖抱拍嗝10-15分钟', tag: ' 技能学习', tagClass: 'skill' },
    { week: 1, text: '记录宝宝第一次排便排尿', desc: '胎便（黑绿色粘稠）应在24小时内排出，如24小时未排告知医生。24小时内至少有1次湿尿布（之后每天6+次）', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 1, text: '每天测量宝宝体温', desc: '每天早晚各一次，正常36.5-37.5℃。超过38℃或低于36℃立即告知医生。注意保暖但不过度包裹', tag: ' 技能学习', tagClass: 'baby' },
    { week: 1, text: '坚持皮肤接触（skin-to-skin）', desc: '每天让宝宝光着上身趴在妈妈裸露胸口30分钟以上，覆盖毯子保暖。稳定宝宝体温、心跳、呼吸，促进亲子关系，刺激泌乳', tag: ' 技能学习', tagClass: 'skill' },
    { week: 1, text: '产后饮食：第1周清淡易消化', desc: '宜吃：小米粥、软烂面条、蒸蛋羹、清淡蔬菜汤。忌：油腻、催奶浓汤（产后3-5天生理性涨奶期，过早喝浓汤易堵奶）。补充铁质：动物肝脏50g/次+红肉', tag: ' 知识学习', tagClass: 'mom' },
    { week: 1, text: '监测新生儿生理性黄疸', desc: '生理性黄疸2-3天出现7-10天消退，每天观察皮肤和眼白颜色，多吃多排是最好退黄方式', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 1, text: '新生儿喂养量逐步增加', desc: '第1周奶量从10ml逐渐增至60ml/次，每天8-12次，按需喂养不强迫，观察宝宝饥饿信号', tag: ' 技能学习', tagClass: 'baby' },
    { week: 1, text: '新生儿睡眠16-20小时', desc: '1月龄宝宝每天睡眠16-20小时，每次2-4小时醒来吃奶，不分昼夜是正常的，家人轮流照护', tag: ' 知识学习', tagClass: 'baby' },
    { week: 1, text: '产后恶露观察勤换卫生巾', desc: '血性恶露持续3-4天鲜红色量如月经，有腥味无臭味，每2-3小时换一次卫生巾预防感染', tag: ' 医疗事项', tagClass: 'mom' },
    { week: 1, text: '产后哺乳期多喝水2000ml', desc: '哺乳期每天饮水2000ml以上，保证乳汁分泌充足，避免酒精和含酒精饮品，控制咖啡因摄入', tag: ' 知识学习', tagClass: 'mom' },

    // ═══ 产后第 2 周（week 2）═══
    { week: 2, text: '监测宝宝黄疸', desc: '观察皮肤和眼白颜色。生理性黄疸：3-5天出现，7-10天消退，数值＜12mg/dL。如超15mg/dL或蔓延到四肢/手心脚心需就医。多吃多排是最好退黄方式', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 2, text: '脐带护理（每天消毒）', desc: '用75%酒精或碘伏从根部向外消毒，保持干燥透气。一般7-15天自然脱落。出现红肿/渗液/异味/发热需就医', tag: ' 技能学习', tagClass: 'skill' },
    { week: 2, text: '观察妈妈恶露情况', desc: '正常变化：血性恶露（产后3-4天，鲜红）→浆液性（4-14天，淡粉）→白色（3周后，乳白）。异常信号：有臭味、量突增（1小时湿透卫生巾）、鲜红超过10天需就医', tag: ' 医疗事项', tagClass: 'mom' },
    { week: 2, text: '记录宝宝喂养和排泄', desc: '每日喂养8-12次，每次15-30分钟。第2周目标：6+湿尿布/天，3+大便/天（黄色糊状）。大便次数比湿尿布更重要', tag: ' 技能学习', tagClass: 'baby' },
    { week: 2, text: '新生儿洗澡（脐带脱落前擦浴）', desc: '脐带脱落前用擦浴，水温37-38℃，室温26-28℃，时间5-10分钟。用无香精沐浴露，最后洗头防止着凉。脐带脱落后可盆浴', tag: ' 技能学习', tagClass: 'baby' },
    { week: 2, text: '宝宝开始补充维生素D', desc: '出生15天后开始补充，每天400IU（滴剂）。母乳宝宝必须补，奶粉宝宝如奶量不足1000ml/天也需补', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 2, text: '产后饮食：第2周增加优质蛋白', desc: '适当增加鱼肉、虾、去皮鸡肉、豆腐。补充钙质：每天500ml牛奶或酸奶+绿叶蔬菜+豆制品。哺乳期需钙1200mg/天', tag: ' 知识学习', tagClass: 'mom' },
    { week: 2, text: '新生儿脐带消毒护理', desc: '每天用75%酒精或碘伏从根部向外消毒，保持干燥透气，一般7-15天自然脱落注意观察', tag: ' 技能学习', tagClass: 'skill' },
    { week: 2, text: '新生儿奶量60-90ml每次', desc: '第2周奶量增至60-90ml/次，每天总奶量400-600ml，观察每天6+湿尿布3+大便为正常', tag: ' 知识学习', tagClass: 'baby' },
    { week: 2, text: '新生儿洗澡水温37-38℃', desc: '脐带脱落前用擦浴，水温37-38℃室温26-28℃，时间5-10分钟，洗后立即擦干涂润肤露', tag: ' 技能学习', tagClass: 'baby' },
    { week: 2, text: '产后饮食第2周加优质蛋白', desc: '增加鱼肉鸡蛋豆腐等优质蛋白，补钙1000mg/天，多喝汤水促进泌乳，避免油腻浓汤', tag: ' 知识学习', tagClass: 'mom' },
    { week: 2, text: '产后哺乳期控制咖啡因', desc: '哺乳期每天咖啡因不超过200mg（约2杯咖啡），过量咖啡因可能通过乳汁影响宝宝睡眠', tag: ' 知识学习', tagClass: 'mom' },

    // ═══ 产后第 3 周（week 3）═══
    { week: 3, text: '预约产后42天复查', desc: '妈妈：盆底肌评估、子宫恢复B超、伤口检查、血常规、血压。宝宝：全面体检、发育评估、黄疸监测。提前预约，一般产后42天±7天', tag: ' 医疗事项', tagClass: 'doc' },
    { week: 3, text: '宝宝接种乙肝疫苗第二针', desc: '出生满1个月接种，带疫苗本和出生证明去社区医院。接种前确保宝宝无发热、感冒、腹泻', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 3, text: '妈妈做心理状态自评', desc: '用EPDS（爱丁堡产后抑郁量表）自测：满分30分，≥10分需警惕，≥13分建议就医。产后情绪低落持续超过2周应寻求专业帮助', tag: ' 知识学习', tagClass: 'mom' },
    { week: 3, text: '学习拍嗝和防吐奶技巧', desc: '每次喂奶后竖抱拍嗝10-15分钟（空心掌由下往上轻拍背部）。拍不出嗝就竖抱20分钟。侧卧睡防吐奶窒息。吐奶时让宝宝侧卧，清理口腔后再抱起', tag: ' 技能学习', tagClass: 'skill' },
    { week: 3, text: '开始俯卧抬头训练（tummy time）', desc: '每天1-2次，每次1-2分钟，在妈妈胸口或床上进行。全程家长看护。锻炼颈部和背部肌肉，预防扁头', tag: ' 技能学习', tagClass: 'baby' },
    { week: 3, text: '学习识别宝宝饥饿信号', desc: '早期信号：寻乳反射（转头找乳头）、吧唧嘴、吃手、伸舌头、舔嘴唇。哭是最后信号，不要等到哭才喂。早期信号喂奶更顺利', tag: ' 知识学习', tagClass: 'skill' },
    { week: 3, text: '新生儿俯卧抬头数秒', desc: '1月龄宝宝俯卧能抬头数秒钟，每天tummy time 1-2分钟分2-3次，全程家长看护', tag: ' 技能学习', tagClass: 'baby' },
    { week: 3, text: '黑白卡追视训练视觉', desc: '在宝宝眼前20-30cm处缓慢移动黑白卡，训练视觉发育和追视能力，每天2-3次每次1-2分钟', tag: ' 技能学习', tagClass: 'baby' },
    { week: 3, text: '迎接新生儿第一个猛涨期', desc: '2-3周是第一个猛涨期，宝宝频繁吃奶夜醒增多烦躁不安，按需满足不限制喂养', tag: ' 知识学习', tagClass: 'baby' },
    { week: 3, text: '产后第3周可加催奶汤', desc: '可加鲫鱼豆腐汤、通草猪蹄汤（撇去浮油），每日饮水2000ml以上促进泌乳', tag: ' 知识学习', tagClass: 'mom' },
    { week: 3, text: '产后哺乳期避免酒精', desc: '哺乳期避免饮酒和含酒精饮品，酒精会通过乳汁影响宝宝，如饮酒需间隔2小时以上再哺乳', tag: ' 知识学习', tagClass: 'mom' },

    // ═══ 产后第 4 周（week 4）═══
    { week: 4, text: '满月体检', desc: '测量体重（增长600-1500g正常）、身高（增长3-5cm）、头围（增长2-3cm），评估发育情况。检查黄疸、脐带、皮肤', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 4, text: '开始记录生长曲线', desc: '每月记录体重、身高、头围数据，绘制生长曲线（WHO标准）。关注百分比趋势而非单次数值。持续走低或走高需咨询医生', tag: ' 技能学习', tagClass: 'baby' },
    { week: 4, text: '产后恢复评估（子宫恢复）', desc: '产后4周子宫约缩小至孕12周大小（耻骨联合上可触及）。恶露应转为白色或淡黄色。如仍鲜红色需就医', tag: ' 医疗事项', tagClass: 'mom' },
    { week: 4, text: '学习肠绞痛缓解方法', desc: '排气操（蹬自行车+顺时针揉肚子）、飞机抱（让宝宝趴在前臂上）、白噪音、襁褓包裹。黄昏哭闹常见，一般3-4个月缓解。不要一哭就喂奶', tag: ' 技能学习', tagClass: 'skill' },
    { week: 4, text: '宝宝奶量观察', desc: '3-4周奶量增至90-120ml/次，每天总奶量500-700ml。按需喂养不强迫。注意猛涨期信号：频繁吃奶、吃奶不专心、夜醒增多', tag: ' 知识学习', tagClass: 'baby' },
    { week: 4, text: '用黑白卡练习追视', desc: '在宝宝面前20-30cm处缓慢移动黑白卡（左右、上下）。每天2-3次，每次1-2分钟。宝宝视线会跟随卡片移动', tag: ' 技能学习', tagClass: 'baby' },
    { week: 4, text: '新生儿肠胀气排气操', desc: '排气操（蹬自行车+顺时针揉肚子）、飞机抱、白噪音，喂奶后竖抱拍嗝10-15分钟预防胀气', tag: ' 技能学习', tagClass: 'skill' },
    { week: 4, text: '补充维生素D每天400IU', desc: '出生15天后每天补充维生素D 400IU滴剂，母乳宝宝必须补充，奶粉宝宝奶量不足1000ml也需补', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 4, text: '红屁屁预防勤换尿不湿', desc: '勤换尿不湿2-3小时一次，每次换后涂护臀膏（含氧化锌），保持屁屁干爽预防红屁屁', tag: ' 技能学习', tagClass: 'baby' },
    { week: 4, text: '产后适当下床活动', desc: '顺产产后6-12小时可下床慢走，剖腹产24-48小时拔尿管后下床，早期下床预防血栓', tag: ' 知识学习', tagClass: 'mom' },
    { week: 4, text: '产后腹直肌自测方法', desc: '平躺屈膝抬头手指摸腹中线，＜2指正常，2-3指需做修复训练，避免卷腹等加重分离动作', tag: ' 知识学习', tagClass: 'mom' },

    // ═══ 产后第 5 周（week 5）═══
    { week: 5, text: '准备42天复查资料', desc: '整理出院小结、产检报告、宝宝出生证明、疫苗本、问题清单（提前想好要问医生的问题）', tag: ' 医疗事项', tagClass: 'doc' },
    { week: 5, text: '开始凯格尔运动（盆底肌修复）', desc: '产后1周开始（排除感染/恶露过多）。收缩盆底肌（像憋尿）5秒→放松5秒，每天3组每组10-15次。不要憋气，不要夹腿。顺产剖腹产都需做', tag: ' 技能学习', tagClass: 'mom' },
    { week: 5, text: '观察宝宝发育里程碑', desc: '宝宝清醒时间延长至3-4小时，开始有意识微笑，能短暂追视人脸和黑白卡。对熟悉的声音（妈妈/爸爸）有反应', tag: ' 知识学习', tagClass: 'baby' },
    { week: 5, text: '区分昼夜，培养作息', desc: '白天保持室内明亮、正常活动声音，和宝宝互动玩耍。晚上保持昏暗安静，喂夜奶不开大灯、不逗宝宝。帮助建立昼夜节律', tag: ' 技能学习', tagClass: 'baby' },
    { week: 5, text: '宝宝开始发出"啊呜"声', desc: '多和宝宝面对面说话、唱歌，模仿宝宝发出的声音。这促进语言发育。每天至少和宝宝"对话"15分钟', tag: ' 技能学习', tagClass: 'baby' },
    { week: 5, text: '产后饮食：第3周起可加催奶汤', desc: '增加鲫鱼豆腐汤、通草猪蹄汤（撇去浮油）。每天饮水2000-2500ml（包括汤水）。避免酒、含酒精饮品、咖啡因过量', tag: ' 知识学习', tagClass: 'mom' },
    { week: 5, text: '1月龄乙肝疫苗第二针', desc: '出生满1个月接种乙肝疫苗第二针，带疫苗本和出生证明去社区医院，接种前确认无发热感冒', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 5, text: '新生儿抚触每天10-15分钟', desc: '每天洗澡后做抚触10-15分钟，用抚触油，促进亲子关系帮助消化改善睡眠', tag: ' 技能学习', tagClass: 'skill' },
    { week: 5, text: '打嗝吐奶侧卧防呛奶', desc: '喂奶后竖抱拍嗝10-15分钟，吐奶时让宝宝侧卧防呛奶，清理口腔后再抱起，不要立即竖抱', tag: ' 技能学习', tagClass: 'baby' },
    { week: 5, text: '产后心理EPDS自评', desc: 'EPDS自评≥10分需警惕，≥13分建议就医，产后情绪低落持续超2周需寻求专业帮助', tag: ' 知识学习', tagClass: 'mom' },
    { week: 5, text: '产后哺乳期补钙1000mg', desc: '哺乳期每天补钙1000mg，可通过牛奶酸奶豆制品和钙片补充，保证乳汁中钙含量', tag: ' 知识学习', tagClass: 'mom' },

    // ═══ 产后第 6 周（week 6）═══
    { week: 6, text: '产后42天复查（妈妈+宝宝）', desc: '妈妈：盆底肌评估（肌力＜3级需治疗）、子宫B超、伤口检查、血常规、心理评估。宝宝：全面体检+发育评估+黄疸监测。这是产后最重要的检查', tag: ' 医疗事项', tagClass: 'urgent' },
    { week: 6, text: '宝宝抬头训练（俯卧45°）', desc: '每天俯卧2-3次，每次2-3分钟。6周宝宝能抬头45°左右。用玩具/镜子吸引宝宝抬头，锻炼颈部肌肉', tag: ' 技能学习', tagClass: 'baby' },
    { week: 6, text: '宝宝接种疫苗（2月龄联合接种）', desc: '五联/百白破第一针、13价肺炎第一针、口服五价轮状疫苗第一剂（需在12周内完成第一剂）。可同时在不同部位接种', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 6, text: '妈妈逐步恢复温和运动', desc: '散步、产后瑜伽、快走（心率＜120次/分钟）。盆底肌未恢复前不跑步/不跳绳/不做仰卧起坐。顺产剖腹产运动恢复节奏不同', tag: ' 技能学习', tagClass: 'mom' },
    { week: 6, text: '肠胀气高发期护理', desc: '坚持每天做排气操，喂奶前充分排气（奶瓶排气孔朝上），飞机抱安抚。2月龄是肠胀气高发期，一般3-4月龄缓解', tag: ' 技能学习', tagClass: 'baby' },
    { week: 6, text: '宝宝奶量增长至120-150ml/次', desc: '总奶量600-800ml/天，奶嘴从SS过渡到S号。母乳按需但不一哭就喂。注意区分饥饿和寻求安抚', tag: ' 知识学习', tagClass: 'baby' },
    { week: 6, text: '2月龄宝宝抬头更稳能笑出声', desc: '2月龄宝宝俯卧抬头45°更稳定，能笑出声，对熟悉声音有反应，开始发出"啊呜"等元音', tag: ' 知识学习', tagClass: 'baby' },
    { week: 6, text: '2月龄奶量90-120ml每天6-8次', desc: '2月龄宝宝奶量90-120ml/次，每天6-8次，总奶量600-800ml，按需喂养灵活调整', tag: ' 知识学习', tagClass: 'baby' },
    { week: 6, text: '2月龄睡眠16-18小时', desc: '2月龄每天睡眠16-18小时，白天小睡4-5次，夜间连续睡眠4-5小时，开始建立昼夜节律', tag: ' 知识学习', tagClass: 'baby' },
    { week: 6, text: '产后42天复查妈妈盆底肌', desc: '妈妈盆底肌评估+子宫恢复B超，宝宝全面体检+发育评估+黄疸监测，这是产后最重要检查', tag: ' 医疗事项', tagClass: 'urgent' },
    { week: 6, text: '2月龄宝宝追视180°训练', desc: '2月龄宝宝能追视180°，用彩色卡和摇铃练习追视追听，促进感官发育', tag: ' 技能学习', tagClass: 'baby' },

    // ═══ 产后第 7 周（week 7）═══
    { week: 7, text: '和宝宝互动游戏', desc: '黑白卡升级彩色卡追视、摇铃追听（在宝宝耳边轻摇）、和宝宝说话唱歌、让宝宝看镜子。每次5-10分钟', tag: ' 技能学习', tagClass: 'baby' },
    { week: 7, text: '了解宝宝睡眠规律', desc: '新生儿睡眠16-18小时/天，白天小睡5-7小时（分4-5次），夜间8-10小时（2-3小时醒一次喂奶）。没有昼夜概念是正常的', tag: ' 知识学习', tagClass: 'baby' },
    { week: 7, text: '妈妈营养补充不能停', desc: '哺乳期继续补钙1000mg/天+维生素D 400IU/天，保证奶水质量。多吃优质蛋白（鱼/肉/蛋/奶/豆制品），保证每日水分2000ml+', tag: ' 知识学习', tagClass: 'mom' },
    { week: 7, text: '宝宝有意识微笑', desc: '宝宝开始对人的脸有反应，会主动微笑。多回应宝宝的笑容，这是社交发展的第一步。和宝宝面对面笑、做鬼脸', tag: ' 知识学习', tagClass: 'baby' },
    { week: 7, text: '识别宝宝不同哭声', desc: '饿了：急促"a"声、晃脑袋、咂嘴。困了：揉眼睛、打哈欠、眼神发呆。胀气：烦躁哼哼、蹬腿、脸憋红。尿布湿：急躁扭动、哭一阵停一阵。不舒服：持续尖锐哭闹', tag: ' 技能学习', tagClass: 'skill' },
    { week: 7, text: '黑白卡升级彩色卡追视', desc: '黑白卡升级彩色卡，练习追视和聚焦，每天2-3次每次3-5分钟，促进视觉发育', tag: ' 技能学习', tagClass: 'baby' },
    { week: 7, text: '肠胀气高发期飞机抱安抚', desc: '2月龄肠胀气高发期，坚持排气操、飞机抱、白噪音安抚，一般3-4月龄自然缓解', tag: ' 技能学习', tagClass: 'baby' },
    { week: 7, text: '口欲期吃手保持清洁', desc: '宝宝开始吃手探索世界，保持手部清洁提供安全牙胶，不要阻止吃手这是正常发育', tag: ' 知识学习', tagClass: 'baby' },
    { week: 7, text: '坚持凯格尔运动盆底肌修复', desc: '坚持凯格尔运动，收缩5秒放松5秒每天3组，顺产剖腹产都需要做，坚持才有效果', tag: ' 技能学习', tagClass: 'mom' },
    { week: 7, text: '新生儿医保3个月内办理', desc: '新生儿医保需在出生后3个月内办理，准备好出生证明户口本照片等材料，越早办越好', tag: ' 知识学习', tagClass: 'baby' },
    { week: 7, text: '宝宝2月龄听觉发育训练', desc: '用摇铃在宝宝耳边轻摇练习追听，和宝宝说话唱歌，促进听觉发育和语言感知', tag: ' 技能学习', tagClass: 'baby' },

    // ═══ 产后第 8 周（week 8）═══
    { week: 8, text: '建立"吃-玩-睡"循环模式', desc: '顺序：醒来先喂奶→拍嗝→玩一会儿（俯卧/互动/看黑白卡）→观察睡眠信号（揉眼睛/打哈欠）→及时哄睡。避免吃着奶睡的习惯', tag: ' 技能学习', tagClass: 'baby' },
    { week: 8, text: '妈妈盆底肌康复评估', desc: '42天复查后根据评估结果决定是否需要盆底康复治疗。如肌力≤3级或出现漏尿，建议做电刺激+生物反馈治疗（10次/疗程，医保可报销部分）', tag: ' 医疗事项', tagClass: 'mom' },
    { week: 8, text: '准备宝宝2月龄用品', desc: '换S码尿不湿（NB用完了）、买59码衣服、准备牙胶（开始口欲期）、换2号奶嘴', tag: ' 物品准备', tagClass: 'baby' },
    { week: 8, text: '宝宝俯卧抬头45-90°', desc: '2个月宝宝俯卧能抬头至45-90°，开始练抓握（摇铃、软胶玩具）。俯卧时间增加到每天3-4次，每次3-5分钟', tag: ' 技能学习', tagClass: 'baby' },
    { week: 8, text: '使用襁褓/睡袋应对惊跳反射', desc: '宝宝睡觉时惊跳反射（Moro反射）明显，用襁褓包裹或投降式睡袋，提高睡眠质量。注意不要包裹太紧，宝宝能自由活动髋关节', tag: ' 技能学习', tagClass: 'baby' },
    { week: 8, text: '俯卧抬头45-90°训练', desc: '2月龄宝宝抬头45-90°，每天俯卧3-4次每次3-5分钟，用玩具吸引抬头锻炼颈部肌肉', tag: ' 技能学习', tagClass: 'baby' },
    { week: 8, text: '惊跳反射襁褓包裹', desc: '使用襁褓包裹或投降式睡袋，减少惊跳反射对睡眠的影响，注意髋关节能自由活动', tag: ' 技能学习', tagClass: 'baby' },
    { week: 8, text: '建立吃玩睡循环模式', desc: '按吃-玩-睡顺序循环，避免奶睡习惯，抓住睡眠信号及时哄睡，建立规律作息', tag: ' 技能学习', tagClass: 'baby' },
    { week: 8, text: '腹直肌分离自测方法', desc: '平躺屈膝抬头手指摸腹中线，＜2指正常，2-3指需修复训练，≥3指建议就医避免卷腹', tag: ' 知识学习', tagClass: 'mom' },
    { week: 8, text: '宝宝2月龄可笑出声', desc: '2月龄宝宝能笑出声，多和宝宝面对面互动做鬼脸，回应宝宝的笑容促进社交发育', tag: ' 知识学习', tagClass: 'baby' },
    { week: 8, text: '宝宝每天俯卧累计30分钟', desc: '2月龄宝宝每天俯卧总时间可累计30分钟，分多次进行，锻炼颈背肩部肌肉力量', tag: ' 技能学习', tagClass: 'baby' },

    // ═══ 产后第 9 周（week 9）═══
    { week: 9, text: '宝宝疫苗第二针', desc: '五联/百白破第二针、13价肺炎第二针、口服轮状第二剂。按时接种，不提前不推迟太久。接种后留观30分钟', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 9, text: '学习婴儿抚触手法', desc: '每天洗澡后做抚触：胸部→腹部（顺时针）→四肢（从近端到远端）→背部（从上到下）。用抚触油，每次10-15分钟。促进亲子关系、帮助消化、改善睡眠', tag: ' 技能学习', tagClass: 'skill' },
    { week: 9, text: '关注宝宝情绪表达', desc: '宝宝开始对不同人有不同反应，对熟悉的人笑，对陌生人警惕或哭。这是正常的社交发育，不要强迫宝宝被陌生人抱', tag: ' 知识学习', tagClass: 'baby' },
    { week: 9, text: '宝宝抓握能力发展', desc: '从无意识抓握到有意识抓握。给宝宝不同材质的玩具（摇铃、软胶玩具、布书），练习手眼协调。注意玩具安全（无小零件、不掉色）', tag: ' 技能学习', tagClass: 'baby' },
    { week: 9, text: '妈妈腹式呼吸修复腹直肌', desc: '仰卧屈膝，鼻吸4秒（腹部鼓起），嘴呼6秒（腹部收紧像拉上拉链）。每天10分钟。腹直肌分离≥2指前避免卷腹/平板支撑', tag: ' 技能学习', tagClass: 'mom' },
    { week: 9, text: '2月龄疫苗接种脊灰+百白破', desc: '脊灰第一针+百白破第一针，可同时在不同部位接种，接种后留观30分钟', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 9, text: '新生儿抓握能力训练', desc: '给宝宝不同材质安全玩具（摇铃/软胶/布书），练习抓握和手眼协调，注意玩具安全', tag: ' 技能学习', tagClass: 'baby' },
    { week: 9, text: '记录生长曲线趋势', desc: '每月记录体重身高头围，参考WHO标准，关注百分比趋势，持续走低或走高需咨询医生', tag: ' 技能学习', tagClass: 'baby' },
    { week: 9, text: '产后温和有氧运动恢复', desc: '顺产6周后可快走/产后瑜伽，剖腹产需评估，盆底肌恢复前避免跑步跳跃仰卧起坐', tag: ' 技能学习', tagClass: 'mom' },
    { week: 9, text: '宝宝每天tummy time累计', desc: '每天俯卧总时间累计15-30分钟，分多次进行，锻炼颈背肌肉预防扁头', tag: ' 技能学习', tagClass: 'baby' },

    // ═══ 产后第 10 周（week 10）═══
    { week: 10, text: '宝宝抓握训练升级', desc: '给不同材质的玩具（软胶、布书、摇铃、牙胶），练习抓握和手眼协调。把玩具放在宝宝伸手可及的地方', tag: ' 技能学习', tagClass: 'baby' },
    { week: 10, text: '妈妈腹直肌分离自测', desc: '平躺屈膝，抬头看肚脐，用手指摸腹中线。＜2指正常，2-3指需做修复训练，≥3指建议就医。避免卷腹/平板支撑等加重分离的动作', tag: ' 知识学习', tagClass: 'mom' },
    { week: 10, text: '了解厌奶期', desc: '3个月左右可能出现厌奶：吃奶分心、奶量下降、吃吃停停。应对：安静环境喂奶、增加运动消耗（多趴/玩）、延长喂奶间隔。不要强迫喂奶', tag: ' 知识学习', tagClass: 'baby' },
    { week: 10, text: '宝宝口欲期护理', desc: '宝宝开始吃手、啃咬玩具。不要阻止（口欲期正常，是探索世界的方式），保持手部清洁，提供安全的牙胶/咬咬乐', tag: ' 知识学习', tagClass: 'baby' },
    { week: 10, text: '白天小睡规律化', desc: '2-3个月白天小睡3-4次，每次30分钟-2小时。抓住揉眼睛、打哈欠、眼神发呆的睡眠信号，在过度疲劳前哄睡', tag: ' 技能学习', tagClass: 'baby' },
    { week: 10, text: '3月龄宝宝抬头稳定90°', desc: '3月龄宝宝俯卧抬头稳定90°，能从仰躺翻到侧卧，对熟悉人微笑，追视180°', tag: ' 知识学习', tagClass: 'baby' },
    { week: 10, text: '3月龄奶量120-150ml每天5-6次', desc: '3月龄奶量120-150ml/次，每天5-6次，总奶量800-1000ml，开始建立喂养规律', tag: ' 知识学习', tagClass: 'baby' },
    { week: 10, text: '3月龄睡眠15-17小时', desc: '3月龄每天睡眠15-17小时，白天小睡3-4次，夜间连续睡眠5-6小时，睡眠更规律', tag: ' 知识学习', tagClass: 'baby' },
    { week: 10, text: '了解睡眠倒退期3-4个月', desc: '3-4个月可能出现睡眠倒退，夜醒增多入睡困难，是正常发育现象，保持规律作息安抚', tag: ' 知识学习', tagClass: 'baby' },
    { week: 10, text: '宝宝3月龄从仰躺翻侧卧', desc: '3月龄宝宝能从仰躺翻到侧卧，多趴着玩增强核心力量，用玩具引导翻身练习', tag: ' 技能学习', tagClass: 'baby' },
    { week: 10, text: '宝宝3月龄能区分熟悉陌生人', desc: '3月龄宝宝对熟悉人微笑对陌生人警惕，这是正常社交发育，不要强迫被陌生人抱', tag: ' 知识学习', tagClass: 'baby' },

    // ═══ 产后第 11 周（week 11）═══
    { week: 11, text: '准备3月龄体检', desc: '提前预约体检，整理喂养/睡眠/排泄记录、想问医生的问题（发育/喂养/睡眠/疫苗）', tag: ' 医疗事项', tagClass: 'doc' },
    { week: 11, text: '了解睡眠倒退期', desc: '3-4个月可能出现睡眠倒退：夜醒增多、小睡变短、入睡困难。这是正常发育现象（大脑成熟+睡眠模式转变），保持规律作息和安抚方式', tag: ' 知识学习', tagClass: 'baby' },
    { week: 11, text: '妈妈回归职场准备（如需背奶）', desc: '提前准备：电动吸奶器（双边的更高效）、储奶袋、背奶包（带冰袋）。提前1-2周开始存奶。规划育儿安排（托育/家人/保姆/育儿嫂）', tag: ' 物品准备', tagClass: 'mom' },
    { week: 11, text: '宝宝语言发育', desc: '宝宝开始发出更多声音（啊、呜、哦、咦），模仿大人的语调。多和宝宝对话、念儿歌、读绘本。回应宝宝发出的每一个声音', tag: ' 技能学习', tagClass: 'baby' },
    { week: 11, text: '减少夜奶次数', desc: '3个月宝宝夜间可连续睡5-6小时，逐步减少夜奶次数（从3次→2次）。睡前密集喂养，夜醒先安抚再喂奶，为睡整觉铺垫', tag: ' 技能学习', tagClass: 'baby' },
    { week: 11, text: '了解厌奶期应对方法', desc: '3个月左右出现厌奶期，吃奶分心奶量下降。安静环境喂奶增加运动消耗，不强迫喂养', tag: ' 知识学习', tagClass: 'baby' },
    { week: 11, text: '俯卧翻身准备练习', desc: '多趴着玩增强核心力量，用玩具引导从仰卧翻到侧卧，为翻身做好准备', tag: ' 技能学习', tagClass: 'baby' },
    { week: 11, text: '培养自主入睡能力', desc: '轻拍安抚替代抱睡奶睡，建立睡前仪式，培养宝宝自主入睡能力，为睡眠过渡做准备', tag: ' 技能学习', tagClass: 'baby' },
    { week: 11, text: '背奶准备吸奶器储奶袋', desc: '准备电动吸奶器+储奶袋+背奶包，提前1-2周开始存奶，规划育儿安排和返工计划', tag: ' 物品准备', tagClass: 'mom' },
    { week: 11, text: '宝宝猛涨期3个月左右', desc: '3个月左右是第三个猛涨期，频繁吃奶夜醒增多烦躁，按需喂养多安抚，一般持续2-3天', tag: ' 知识学习', tagClass: 'baby' },
    { week: 11, text: '宝宝3月龄开始认生', desc: '3月龄宝宝开始认生是正常社交发育，多带宝宝接触不同人，但不要强迫被不熟悉的人抱', tag: ' 知识学习', tagClass: 'baby' },

    // ═══ 产后第 12 周（week 12）═══
    { week: 12, text: '三个月体检（全面发育评估）', desc: '评估指标：俯卧抬头90°、追视180°、抓握能力、社交反应（微笑/认人）、体重身高头围。体重约为出生时2倍', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 12, text: '宝宝疫苗第三针', desc: '五联/百白破第三针、13价肺炎第三针、口服轮状第三剂。接种后观察反应，可能出现低热/烦躁，一般1-2天缓解', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 12, text: '宝宝翻身准备训练', desc: '多趴着玩增强核心力量，用玩具引导翻身（仰卧→侧卧→俯卧）。每天练习5-10分钟分多次。全程看护，注意安全', tag: ' 技能学习', tagClass: 'baby' },
    { week: 12, text: '回顾产后3个月恢复情况', desc: '评估：体重恢复（每周减重≤0.5kg哺乳期）、盆底肌力（肌力≥3级正常）、腹直肌分离（＜2指正常）、情绪状态。如有问题及时咨询医生', tag: ' 知识学习', tagClass: 'mom' },
    { week: 12, text: '建立稳定"吃-玩-睡"模式', desc: '白天间隔3-4小时喂奶，建立睡前仪式（洗澡→抚触→喂奶→哄睡）。夜奶2-3次。白天小睡3-4次', tag: ' 技能学习', tagClass: 'baby' },
    { week: 12, text: '准备宝宝翻身期安全措施', desc: '床栏加固、地面铺爬行垫、收起周围危险物品（塑料袋/小物件/电线）。永远不要单独留宝宝在大床上。开始考虑安装围栏', tag: ' 物品准备', tagClass: 'baby' },
    { week: 12, text: '妈妈逐步恢复中等强度运动', desc: '盆底肌评估OK后可加入：游泳、室内单车、快走（心率120-140次/分钟）。避免高强度HIIT、跳跃运动。哺乳期运动后30分钟再喂奶', tag: ' 技能学习', tagClass: 'mom' },
    { week: 12, text: '3月龄脊灰第二针+百白破第二针', desc: '脊灰第二针+百白破第二针，按时接种不提前不推迟太久，接种后观察低热烦躁反应', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 12, text: '彩色卡训练感官发展', desc: '升级彩色卡追视，提供布书摇铃等感官玩具，促进认知发育和手眼协调能力', tag: ' 技能学习', tagClass: 'baby' },
    { week: 12, text: '湿疹护理保湿避汗', desc: '保持皮肤保湿避免过热出汗，穿纯棉透气衣物，严重时在医生指导下使用激素药膏', tag: ' 技能学习', tagClass: 'baby' },
    { week: 12, text: '产后巩固期有氧运动', desc: '盆底肌评估OK后可游泳/室内单车/快走，避免HIIT和跳跃运动，循序渐进恢复体能', tag: ' 技能学习', tagClass: 'mom' },
    { week: 12, text: '宝宝体重约为出生时2倍', desc: '3月龄宝宝体重约为出生时2倍，身高增长约10cm，评估生长发育是否达标', tag: ' 知识学习', tagClass: 'baby' },
    { week: 12, text: '宝宝3月龄追视可达180°', desc: '3月龄宝宝追视能力可达180°，用彩色卡和移动玩具锻炼视觉追踪能力', tag: ' 技能学习', tagClass: 'baby' },
  ];

  // ─── DOM refs ───
  const dueDateInput = document.getElementById('due-date');
  const setBtn = document.getElementById('set-date-btn');
  const resetBtn = document.getElementById('reset-btn');
  const stageBanner = document.getElementById('stage-banner');
  const stageName = document.getElementById('stage-name');
  const stageDetail = document.getElementById('stage-detail');
  const stageProgress = document.getElementById('stage-progress');
  const overallProgress = document.getElementById('overall-progress');
  const taskSection = document.getElementById('task-section');
  const taskContainer = document.getElementById('task-container');
  const emptySection = document.getElementById('empty-section');

  // ─── 工具函数 ───
  function weeksBetween(d1, d2) {
    const diff = d2.getTime() - d1.getTime();
    return Math.round(diff / (7 * 24 * 60 * 60 * 1000));
  }

  function formatDate(date) {
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  }

  // ─── 获取当前阶段信息 ───
  function getStageInfo(dueDateStr) {
    const today = new Date();
    today.setHours(0,0,0,0);
    const dueDate = new Date(dueDateStr);
    dueDate.setHours(0,0,0,0);

    const weeksToDue = weeksBetween(today, dueDate);

    if (weeksToDue > 12) {
      return {
        stage: 'early',
        label: ' 孕早期/中期',
        detail: `距离预产期还有 ${weeksToDue} 周，还不到使用时间`,
        progress: '',
        currentWeek: null,
        allWeeks: []
      };
    } else if (weeksToDue >= 0) {
      const gw = 40 - weeksToDue;
      const allWeeks = [];
      for (let w = -12; w <= 0; w++) allWeeks.push(w);
      return {
        stage: 'prenatal',
        label: ` 孕晚期 · 孕 ${gw} 周`,
        detail: `距离预产期还有 ${weeksToDue} 周`,
        progress: `孕 ${gw} 周 / 40 周`,
        currentWeek: -weeksToDue,
        allWeeks
      };
    } else {
      const weeksAfter = Math.abs(weeksToDue);
      const allWeeks = [];
      for (let w = 1; w <= 12; w++) allWeeks.push(w);
      return {
        stage: 'postpartum',
        label: ` 产后 · 第 ${weeksAfter} 周`,
        detail: `宝宝出生 ${weeksAfter} 周了`,
        progress: `产后第 ${Math.min(weeksAfter, 12)} 周 / 12 周`,
        currentWeek: weeksAfter,
        allWeeks
      };
    }
  }

  function weekLabel(week) {
    if (week < 0) return `孕 ${40 + week} 周`;
    if (week === 0) return ' 预产期';
    return `产后第 ${week} 周`;
  }

  function weekStatus(week, currentWeek) {
    if (currentWeek === null) return '';
    if (week < currentWeek) return '✅ 已完成区域';
    if (week === currentWeek) return ' 当前阶段';
    return ' 即将到来';
  }

  function isCurrentWeek(week, currentWeek) {
    return currentWeek !== null && week === currentWeek;
  }

  // ─── 渲染 ───
  function render() {
    const saved = localStorage.getItem('nestguide_due_date');
    if (!saved) {
      stageBanner.style.display = 'none';
      overallProgress.style.display = 'none';
      taskSection.style.display = 'none';
      emptySection.style.display = 'block';
      document.querySelector('.empty-state h3').textContent = ' 请设置您的预产期';
      document.querySelector('.empty-state p').innerHTML = '选择日期后，系统会根据您当前所处的阶段<br>展示从孕 28 周到产后 12 周的完整待办清单';
      return;
    }

    dueDateInput.value = saved;
    const info = getStageInfo(saved);

    // 更新 banner
    stageBanner.style.display = 'flex';
    stageName.textContent = info.label;
    stageDetail.textContent = info.detail;
    stageProgress.textContent = info.progress || '';

    if (info.stage === 'early') {
      overallProgress.style.display = 'none';
      taskSection.style.display = 'none';
      emptySection.style.display = 'block';
      document.querySelector('.empty-state h3').textContent = ' 还不到使用时间哦';
      document.querySelector('.empty-state p').innerHTML = info.detail;
      return;
    }

    emptySection.style.display = 'none';
    taskSection.style.display = 'block';

    // 计算统计数据
    const allVisibleTasks = TASK_DB.filter(t => info.allWeeks.includes(t.week));
    // 只显示当前周及之前已完成的任务，加上未来所有任务
    const displayTasks = allVisibleTasks.filter(t => {
      if (info.currentWeek === null) return true;
      return t.week <= info.currentWeek;
    });
    // 但也要显示未来2周的任务（给用户预览）
    const previewTasks = allVisibleTasks.filter(t => {
      if (info.currentWeek === null) return false;
      return t.week > info.currentWeek && t.week <= info.currentWeek + 2;
    });

    const visibleTasks = [...displayTasks, ...previewTasks];

    const totalCount = allVisibleTasks.length;
    let doneCount = 0;
    allVisibleTasks.forEach(t => {
      const key = 'task_' + encodeURIComponent(t.text + '_' + t.week);
      if (localStorage.getItem(key) === 'true') doneCount++;
    });
    const pendingCount = totalCount - doneCount;
    const rate = totalCount > 0 ? Math.round(doneCount / totalCount * 100) : 0;

    document.getElementById('stat-total').textContent = totalCount;
    document.getElementById('stat-done').textContent = doneCount;
    document.getElementById('stat-pending').textContent = pendingCount;
    document.getElementById('stat-rate').textContent = rate + '%';
    document.getElementById('stat-weeks').textContent = info.allWeeks.length;
    overallProgress.style.display = 'block';

    // 按周分组渲染
    let html = '';
    info.allWeeks.forEach(week => {
      const tasks = allVisibleTasks.filter(t => t.week === week);
      if (tasks.length === 0) return;

      let doneInWeek = 0;
      let taskHtml = '';
      tasks.forEach(t => {
        const key = 'task_' + encodeURIComponent(t.text + '_' + t.week);
        const done = localStorage.getItem(key) === 'true';
        if (done) doneInWeek++;
        taskHtml += `
          <div class="task-item${done ? ' done' : ''}" data-key="${key}">
            <div class="task-check">${done ? '✓' : ''}</div>
            <div class="task-content">
              <div class="task-text">${t.text}</div>
              <div class="task-desc">${t.desc}</div>
            </div>
            <span class="task-tag ${t.tagClass}">${t.tag}</span>
          </div>
        `;
      });

      const current = isCurrentWeek(week, info.currentWeek);
      let statusClass = '';
      let statusText = '';
      if (info.currentWeek !== null) {
        if (week < info.currentWeek) {
          statusText = '✅ 已完成';
        } else if (week === info.currentWeek) {
          statusText = ' 当前阶段';
          statusClass = 'current';
        } else if (week <= info.currentWeek + 2) {
          statusText = ' 即将到来';
        } else {
          statusText = ' 未来任务';
        }
      }

      html += `
        <div class="task-group">
          <div class="task-group-header">
            <span class="week-icon">${current ? '  ' : ''}</span>
            <span class="week-label">${weekLabel(week)}</span>
            <span class="week-status ${statusClass}">${statusText}</span>
            <span class="week-progress">${doneInWeek}/${tasks.length}</span>
          </div>
          <div class="task-card">${taskHtml}</div>
        </div>
      `;
    });

    taskContainer.innerHTML = html;

    // 绑定点击事件
    document.querySelectorAll('.task-item').forEach(el => {
      el.addEventListener('click', function() {
        const key = this.dataset.key;
        const done = localStorage.getItem(key) === 'true';
        localStorage.setItem(key, done ? 'false' : 'true');
        render();
      });
    });
  }

  // ─── 事件绑定 ───
  setBtn.addEventListener('click', () => {
    const val = dueDateInput.value;
    if (!val) { alert('请选择预产期或宝宝出生日期'); return; }
    localStorage.setItem('nestguide_due_date', val);
    render();
  });

  resetBtn.addEventListener('click', () => {
    if (!confirm('重置将清除所有已勾选的任务，确定吗？')) return;
    localStorage.removeItem('nestguide_due_date');
    const keys = Object.keys(localStorage);
    keys.forEach(k => { if (k.startsWith('task_')) localStorage.removeItem(k); });
    render();
  });

  // ─── 初始化 ───
  const defaultDate = new Date();
  defaultDate.setDate(defaultDate.getDate() + 12 * 7);
  dueDateInput.value = formatDate(defaultDate);

  if (localStorage.getItem('nestguide_due_date')) {
    render();
  }
})();
</script>
</body>
</html>
