<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初生宝典 NestGuide - 新手父母引导工具</title>
<style>
  :root {
    --rose: #E8A0B4; --rose-light: #FDF2F5; --rose-dark: #C4708A;
    --sage: #B5C9B7; --sage-light: #F0F5F0; --sage-dark: #8DAF90;
    --cream: #FFFBF5; --text: #3D2C2E; --text-light: #7A6A6C;
    --white: #FFFFFF; --shadow: 0 2px 12px rgba(61,44,46,0.08);
    --radius: 16px; --radius-sm: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--cream); color: var(--text); line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: linear-gradient(135deg, var(--rose) 0%, var(--sage) 100%);
    color: var(--white); text-align: center; padding: 48px 20px 36px;
    position: relative; overflow: hidden;
  }
  header::before {
    content: ''; position: absolute; top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 70%, rgba(255,255,255,0.12) 0%, transparent 60%);
    pointer-events: none;
  }
  header h1 { font-size: 2.2rem; font-weight: 700; position: relative; }
  header h1 small { font-size: 0.85rem; font-weight: 400; opacity: 0.85; display: block; margin-top: 4px; }
  header p { margin-top: 12px; font-size: 1rem; opacity: 0.9; position: relative; }

  .container { max-width: 780px; margin: 0 auto; padding: 0 16px; }
  section { padding: 36px 0; }

  /* ─── Due Date Picker ─── */
  .due-date-section { margin-top: -20px; position: relative; z-index: 2; }
  .due-date-card {
    background: var(--white); border-radius: var(--radius);
    box-shadow: 0 4px 20px rgba(61,44,46,0.12); padding: 24px 28px;
  }
  .due-date-row { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .due-date-row label { font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 6px; }
  .due-date-row input[type="date"] {
    padding: 10px 14px; border: 2px solid #E8E0DC; border-radius: var(--radius-sm);
    font-size: 1rem; outline: none; transition: border-color 0.2s;
    background: var(--cream); min-width: 180px;
  }
  .due-date-row input[type="date"]:focus { border-color: var(--rose); }
  .due-date-row .btn {
    padding: 10px 28px; border: none; border-radius: 24px;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
    background: linear-gradient(135deg, var(--rose), var(--sage));
    color: var(--white); transition: transform 0.2s; white-space: nowrap;
  }
  .due-date-row .btn:hover { transform: scale(1.03); }
  .due-date-row .btn-outline {
    background: transparent; border: 2px solid var(--rose); color: var(--rose-dark);
    padding: 8px 20px; border-radius: 24px; font-size: 0.85rem;
    cursor: pointer; transition: all 0.2s; margin-left: 8px;
  }
  .due-date-row .btn-outline:hover { background: var(--rose-light); }

  /* ─── Stage Banner ─── */
  .stage-banner {
    margin-top: 18px;
    background: linear-gradient(135deg, var(--rose-light), var(--sage-light));
    border-radius: var(--radius-sm); padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
  }
  .stage-banner .stage-name { font-size: 1.1rem; font-weight: 700; }
  .stage-banner .stage-detail { font-size: 0.85rem; color: var(--text-light); }
  .stage-banner .stage-progress { font-size: 0.9rem; font-weight: 600; color: var(--rose-dark); }

  /* ─── Overall Progress ─── */
  .overall-progress {
    background: var(--white); border-radius: var(--radius-sm);
    padding: 18px 20px; margin-top: 18px;
    box-shadow: var(--shadow);
  }
  .overall-progress .stat-row {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .overall-progress .stat-item { text-align: center; flex: 1; min-width: 80px; }
  .overall-progress .stat-num { font-size: 1.4rem; font-weight: 700; color: var(--rose-dark); }
  .overall-progress .stat-label { font-size: 0.75rem; color: var(--text-light); }

  /* ─── Task Groups ─── */
  .task-group { margin-bottom: 24px; }
  .task-group-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  .task-group-header .week-label { font-size: 1rem; font-weight: 700; }
  .task-group-header .week-status {
    font-size: 0.75rem; color: var(--text-light);
    background: var(--sage-light); padding: 2px 10px; border-radius: 10px;
  }
  .task-group-header .week-status.current { background: #FDF2F5; color: var(--rose-dark); font-weight: 600; }
  .task-group-header .week-progress { margin-left: auto; font-size: 0.8rem; color: var(--text-light); }
  .task-group-header .week-icon { font-size: 1.1rem; }

  .task-card {
    background: var(--white); border-radius: var(--radius-sm);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .task-item {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 12px 18px; cursor: pointer;
    transition: background 0.15s; border-bottom: 1px solid rgba(0,0,0,0.04);
  }
  .task-item:last-child { border-bottom: none; }
  .task-item:hover { background: var(--sage-light); }
  .task-item.done { opacity: 0.5; }
  .task-item.done .task-text { text-decoration: line-through; }

  .task-check {
    width: 20px; height: 20px; border: 2px solid var(--rose);
    border-radius: 5px; flex-shrink: 0; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; font-size: 12px; color: transparent;
  }
  .task-item.done .task-check { background: var(--rose); border-color: var(--rose); color: var(--white); }

  .task-content { flex: 1; min-width: 0; }
  .task-text { font-size: 0.9rem; font-weight: 500; }
  .task-desc { font-size: 0.78rem; color: var(--text-light); margin-top: 1px; }
  .task-tag {
    flex-shrink: 0; font-size: 0.65rem; padding: 2px 8px;
    border-radius: 8px; white-space: nowrap;
  }
  .task-tag.prep { background: #FDF2F5; color: var(--rose-dark); }
  .task-tag.baby { background: #E8F4FD; color: #2C7BB6; }
  .task-tag.mom { background: #FFF8E8; color: #B8860B; }
  .task-tag.urgent { background: #FDE8E8; color: #C0392B; }
  .task-tag.doc { background: #F0F5F0; color: var(--sage-dark); }
  .task-tag.skill { background: #EDE8F5; color: #6B4C9A; }

  /* ─── Empty State ─── */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
  .empty-state h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }
  .empty-state p { font-size: 0.9rem; }

  footer { text-align: center; padding: 30px 20px; color: var(--text-light); font-size: 0.8rem; border-top: 1px solid rgba(0,0,0,0.06); }
  footer a { color: var(--rose-dark); text-decoration: none; }

  @media (max-width: 480px) {
    header h1 { font-size: 1.6rem; }
    .due-date-card { padding: 18px; }
    .due-date-row { flex-direction: column; align-items: stretch; }
    .due-date-row input[type="date"] { width: 100%; }
    .task-item { padding: 10px 14px; }
    .overall-progress .stat-item { min-width: 60px; }
  }
</style>
</head>
<body>

<header>
  <h1>初生宝典<small>NestGuide</small></h1>
  <p>设置预产期，自动生成从孕晚期到产后 3 个月的完整待办清单</p>
</header>

<div class="container">

  <section class="due-date-section">
    <div class="due-date-card">
      <div class="due-date-row">
        <div>
          <label for="due-date"> 预产期（或宝宝出生日）</label>
          <input type="date" id="due-date">
        </div>
        <button class="btn" id="set-date-btn"> 开始规划</button>
        <button class="btn-outline" id="reset-btn">重置</button>
      </div>
      <div class="stage-banner" id="stage-banner" style="display:none">
        <div>
          <div class="stage-name" id="stage-name"></div>
          <div class="stage-detail" id="stage-detail"></div>
        </div>
        <div class="stage-progress" id="stage-progress"></div>
      </div>
      <div class="overall-progress" id="overall-progress" style="display:none">
        <div class="stat-row">
          <div class="stat-item"><div class="stat-num" id="stat-total">0</div><div class="stat-label">总任务</div></div>
          <div class="stat-item"><div class="stat-num" id="stat-done">0</div><div class="stat-label">已完成</div></div>
          <div class="stat-item"><div class="stat-num" id="stat-pending">0</div><div class="stat-label">待完成</div></div>
          <div class="stat-item"><div class="stat-num" id="stat-rate">0%</div><div class="stat-label">完成率</div></div>
          <div class="stat-item"><div class="stat-num" id="stat-weeks">0</div><div class="stat-label">覆盖周数</div></div>
        </div>
      </div>
    </div>
  </section>

  <section id="task-section" style="display:none">
    <div id="task-container"></div>
  </section>

  <section id="empty-section">
    <div class="empty-state">
      <div class="icon"> </div>
      <h3>请设置您的预产期</h3>
      <p>选择日期后，系统会根据您当前所处的阶段<br>展示从孕 28 周到产后 12 周的完整待办清单</p>
      <p style="margin-top:12px;font-size:0.8rem;color:var(--rose-dark)"> 每周 3-4 项任务，轻松跟上节奏</p>
    </div>
  </section>

</div>

<footer>
  <a href="https://github.com/Wadesha/nestguide">初生宝典 NestGuide</a> · 仅供参考，不构成医疗建议
</footer>

<script>
(function() {
  // ═══════════════════════════════════════════════════
  //  任务数据库：按周负载均衡
  //  week: 负数 = 产前，0 = 预产期，正数 = 产后
  //  每周 3-5 项任务，含物品准备、技能学习、医疗事项
  // ═══════════════════════════════════════════════════
  const TASK_DB = [
    // ═══ 孕 28 周（week -12）═══
    { week: -12, text: '开始数胎动', desc: '每天早中晚各一次，每次数 1 小时，正常 ≥10 次/2 小时。记录胎动次数', tag: ' 技能学习', tagClass: 'skill' },
    { week: -12, text: '预约 28 周产检（糖耐量 OGTT）', desc: '需空腹 8-12 小时，提前开好检查单。检查妊娠期糖尿病', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -12, text: '准备孕妇装和哺乳内衣', desc: '买 2-3 件无钢圈哺乳内衣、2 套哺乳睡衣、托腹带、宽松外裤', tag: ' 物品准备', tagClass: 'prep' },
    { week: -12, text: '了解孕晚期营养补充', desc: '每天补钙 1000mg（牛奶/钙片）、铁 27mg（红肉/铁剂）、DHA 200mg', tag: ' 知识学习', tagClass: 'mom' },
    { week: -12, text: '拍照记录孕肚', desc: '每周拍一次孕肚照留念，记录体重变化', tag: ' 知识学习', tagClass: 'mom' },

    // ═══ 孕 29 周（week -11）═══
    { week: -11, text: '学习新生儿护理基础知识', desc: '了解黄疸（生理性 vs 病理性）、脐带护理（保持干燥）、吐奶处理（侧卧拍背）', tag: ' 技能学习', tagClass: 'skill' },
    { week: -11, text: '准备体重秤和血压计', desc: '每周自测体重（增重≤500g/周）和血压，监控妊娠高血压风险', tag: ' 物品准备', tagClass: 'prep' },
    { week: -11, text: '了解顺产和剖腹产的区别', desc: '了解两种方式的流程、疼痛管理选项、恢复时间和风险', tag: ' 知识学习', tagClass: 'mom' },
    { week: -11, text: '准备出生证明办理材料', desc: '提前想好宝宝名字（男女各备选），准备双方身份证、户口本、结婚证', tag: ' 物品准备', tagClass: 'prep' },

    // ═══ 孕 30 周（week -10）═══
    { week: -10, text: '了解待产包清单', desc: '分妈妈篇（产褥垫/安心裤/哺乳内衣）、宝宝篇（尿不湿/衣服/包被）、证件篇', tag: ' 物品准备', tagClass: 'prep' },
    { week: -10, text: '报名孕妇学校课程', desc: '学习分娩过程、拉玛泽呼吸法、产后护理、新生儿护理、母乳喂养', tag: ' 技能学习', tagClass: 'skill' },
    { week: -10, text: '准备新生儿衣物和包被', desc: '买 3-5 套 52/59 码连体衣（A 类标准）、2 条包被、2 顶胎帽、3 双袜子', tag: ' 物品准备', tagClass: 'baby' },
    { week: -10, text: '预约 30 周产检', desc: '常规产检 + 血常规检查是否贫血，开始每 2 周产检一次', tag: ' 医疗事项', tagClass: 'doc' },

    // ═══ 孕 31 周（week -9）═══
    { week: -9, text: '学习新生儿喂养知识', desc: '母乳喂养按需 8-12 次/天，奶粉冲泡先水后粉（40-50℃），每 3 小时一次', tag: ' 技能学习', tagClass: 'skill' },
    { week: -9, text: '准备哺乳用品', desc: '哺乳内衣 2-3 件、防溢乳垫 1 盒、吸奶器（可先租借）、羊脂膏防乳头皲裂', tag: ' 物品准备', tagClass: 'prep' },
    { week: -9, text: '了解产后恢复基本知识', desc: '恶露变化（红→粉→白，持续 4-6 周）、伤口护理、盆底肌恢复重要性', tag: ' 知识学习', tagClass: 'mom' },
    { week: -9, text: '了解产后抑郁预防', desc: '了解 EPDS 量表、产后情绪低落（2 周内正常）vs 产后抑郁（需就医）', tag: ' 知识学习', tagClass: 'mom' },

    // ═══ 孕 32 周（week -8）═══
    { week: -8, text: '准备待产包（妈妈篇）', desc: '产褥垫 20 片（60×90cm）、安心裤/一次性内裤 15 条、吸管杯、产妇卫生巾、刀纸', tag: ' 物品准备', tagClass: 'prep' },

    { week: -7, text: '学习新生儿常见问题应对', desc: '肠绞痛（排气操/飞机抱）、湿疹（保湿）、热疹（降温）、红屁屁（勤换+护臀膏）', tag: ' 技能学习', tagClass: 'skill' },

    // ═══ 孕 34 周（week -6）═══

    { week: -4, text: '学习产后护理知识', desc: '顺产伤口护理（温水冲洗+碘伏消毒）、剖腹产伤口（保持干燥+硅酮凝胶防疤）', tag: ' 知识学习', tagClass: 'mom' },
    { week: -4, text: '确定产后照顾方案', desc: '月嫂（提前面试签约）/月子中心（提前考察）/家人照顾（提前沟通分工）', tag: ' 物品准备', tagClass: 'prep' },
    { week: -4, text: '买齐新生儿洗护用品', desc: '无香精沐浴露、润肤露、护臀膏、液体爽身露、抚触油、小方巾 6 条', tag: ' 物品准备', tagClass: 'baby' },
    { week: -4, text: '准备好待产零食和补给', desc: '巧克力、功能饮料、矿泉水、吸管、小零食，放待产包侧袋', tag: ' 物品准备', tagClass: 'prep' },

    // ═══ 孕 37 周（week -3）═══
    { week: -3, text: '待产包放门口显眼位置', desc: '随时可能发动，拎包就走。让家人也知道位置', tag: ' 物品准备', tagClass: 'urgent' },
    { week: -3, text: '规划去医院最佳路线', desc: '提前踩点，计算高峰/平峰时间，找好停车场，备选 120 方案', tag: ' 知识学习', tagClass: 'urgent' },
    { week: -3, text: '学习产兆判断方法', desc: '规律宫缩（5-1-1 法则：每 5 分钟一次，持续 1 分钟，连续 1 小时）、破水（平躺抬臀）、见红', tag: ' 技能学习', tagClass: 'skill' },
    { week: -3, text: '保持手机畅通家人待命', desc: '37 周足月后随时可能发动，确保家人能随时联系到，备好出租车/120 电话', tag: ' 知识学习', tagClass: 'urgent' },
    { week: -3, text: '确认产后母乳喂养支持', desc: '了解医院是否有母乳喂养指导、产后开奶服务，准备吸奶器', tag: ' 知识学习', tagClass: 'mom' },

    // ═══ 孕 38 周（week -2）═══
    { week: -2, text: '确认入院流程和证件', desc: '检查身份证、医保卡、母子健康手册、全套产检报告、生育服务单是否齐全', tag: ' 医疗事项', tagClass: 'doc' },
    { week: -2, text: '深入学习母乳喂养知识', desc: '正确衔乳（含住大部分乳晕）、喂养频率（8-12 次/天）、堵奶预防（及时排空）、乳头皲裂预防', tag: ' 技能学习', tagClass: 'skill' },
    { week: -2, text: '准备家中环境', desc: '彻底打扫卫生，设置宝宝专属区域，准备待产零食和手机充电器', tag: ' 物品准备', tagClass: 'prep' },
    { week: -2, text: '准备紧急联系方式清单', desc: '医院电话、产科病房电话、家人电话、出租车/120 备选，贴冰箱上', tag: ' 物品准备', tagClass: 'urgent' },
    { week: -2, text: '学习新生儿疫苗接种计划', desc: '出生 24h：乙肝第一针+卡介苗，1 月：乙肝第二针，2 月：五联/肺炎/轮状', tag: ' 知识学习', tagClass: 'baby' },

    // ═══ 孕 39 周（week -1）═══
    { week: -1, text: '每天数胎动观察产兆', desc: '每天早中晚各数 1 小时，记录宫缩频率/破水/见红情况', tag: ' 技能学习', tagClass: 'urgent' },
    { week: -1, text: '放松心情适当运动', desc: '散步 20 分钟/天，听音乐冥想，保持体力，有助顺产', tag: ' 知识学习', tagClass: 'mom' },
    { week: -1, text: '准备好产后恢复用品', desc: '收腹带（剖腹产必备）、哺乳枕、冷敷贴、私处冲洗器、一次性马桶垫', tag: ' 物品准备', tagClass: 'prep' },
    { week: -1, text: '和家人确认最终分工', desc: '谁负责送医、谁办手续、谁照顾产妇、谁管做饭、谁照顾宝宝', tag: ' 知识学习', tagClass: 'mom' },
    { week: -1, text: '了解分娩疼痛管理方案', desc: '无痛分娩（硬膜外麻醉，费用 1000-2400 元）、导乐陪产、呼吸减痛法', tag: ' 知识学习', tagClass: 'mom' },

    // ═══ 预产期（week 0）═══
    { week: 0, text: '出现产兆立即联系医院', desc: '规律宫缩（5 分钟一次持续 1 小时）/ 破水（平躺抬臀垫高，立即就医）/ 见红', tag: ' 医疗事项', tagClass: 'urgent' },
    { week: 0, text: '带上待产包出发去医院', desc: '检查待产包和证件是否齐全，带手机和充电器，通知陪产人', tag: ' 物品准备', tagClass: 'urgent' },
    { week: 0, text: '保持镇定配合医生', desc: '用拉玛泽呼吸法缓解疼痛，按分娩计划进行，相信自己', tag: ' 技能学习', tagClass: 'mom' },
    { week: 0, text: '产后 1 小时内尽早哺乳', desc: '产后尽早让宝宝吸吮，刺激泌乳和子宫收缩，初乳是宝宝第一剂"疫苗"', tag: ' 医疗事项', tagClass: 'baby' },

    // ═══ 产后第 1 周（week 1）═══
    { week: 1, text: '产后充分休息', desc: '产后 24 小时尽量卧床，让家人多分担。顺产 24h 后可下床慢走，剖腹产 48h 后', tag: ' 知识学习', tagClass: 'mom' },
    { week: 1, text: '伤口护理（顺产/剖腹产）', desc: '顺产：每日温水冲洗 2-3 次+碘伏消毒，勤换卫生垫。剖腹产：保持敷料干燥，观察红肿渗液', tag: ' 技能学习', tagClass: 'mom' },
    { week: 1, text: '学习正确哺乳姿势', desc: '摇篮式/侧卧式/橄榄球式，确保宝宝含住大部分乳晕（不是只含乳头），听到吞咽声', tag: ' 技能学习', tagClass: 'skill' },
    { week: 1, text: '记录宝宝第一次排便排尿', desc: '胎便（黑绿色）应在 24 小时内排出，24 小时内至少有 1 次湿尿布', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 1, text: '每天测量宝宝体温', desc: '每天早晚各一次，正常 36.5-37.5°C。超过 38°C 或低于 36°C 立即告知医生', tag: ' 技能学习', tagClass: 'baby' },
    { week: 1, text: '坚持皮肤接触（skin-to-skin）', desc: '每天让宝宝趴在妈妈裸露胸口 30 分钟以上，稳定体温、心跳、呼吸，促进亲子关系', tag: ' 技能学习', tagClass: 'skill' },

    // ═══ 产后第 2 周（week 2）═══
    { week: 2, text: '监测宝宝黄疸', desc: '观察皮肤和眼白颜色，生理性黄疸 3-5 天出现，12mg/dL 以下正常。超过 15 或蔓延到四肢需就医', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 2, text: '脐带护理', desc: '用 75% 酒精或碘伏从根部向外消毒，保持干燥。脐带一般 10-21 天脱落。有红肿/渗液/异味就医', tag: ' 技能学习', tagClass: 'skill' },
    { week: 2, text: '观察妈妈恶露情况', desc: '颜色从鲜红→淡红→白色，量逐渐减少。正常持续 4-6 周。有臭味/量突增/鲜红超过 10 天需就医', tag: ' 医疗事项', tagClass: 'mom' },
    { week: 2, text: '记录宝宝喂养和排泄', desc: '每日喂养 8-12 次，每次 15-30 分钟。第 2 周目标：6+ 湿尿布/天，3+ 大便/天', tag: ' 技能学习', tagClass: 'baby' },
    { week: 2, text: '新生儿洗澡（擦浴）', desc: '脐带脱落前擦浴，水温 37-38°C，室温 26-28°C，时间 5-10 分钟，用无香精沐浴露', tag: ' 技能学习', tagClass: 'baby' },
    { week: 2, text: '宝宝开始补充维生素 D', desc: '出生 15 天后开始补充，每天 400IU（滴剂），奶粉宝宝如奶量不足 32oz/天也需补充', tag: ' 医疗事项', tagClass: 'baby' },

    // ═══ 产后第 3 周（week 3）═══
    { week: 3, text: '预约产后 42 天复查', desc: '妈妈：盆底肌评估、子宫恢复、伤口检查、血常规。宝宝：全面体检、发育评估', tag: ' 医疗事项', tagClass: 'doc' },
    { week: 3, text: '宝宝接种乙肝疫苗第二针', desc: '出生满 1 个月接种，带上疫苗本和出生证明去社区医院', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 3, text: '妈妈做心理状态自评', desc: '用 EPDS 量表自测（满分 30 分，≥10 分需警惕，≥13 分建议就医），低落超过 2 周寻求帮助', tag: ' 知识学习', tagClass: 'mom' },
    { week: 3, text: '学习拍嗝和防吐奶技巧', desc: '每次喂奶后竖抱拍嗝 10-15 分钟（空心掌由下往上），侧卧睡防吐奶窒息', tag: ' 技能学习', tagClass: 'skill' },
    { week: 3, text: '开始俯卧抬头训练', desc: '每天 1-2 次，每次 1-2 分钟，在妈妈胸口或床上进行。全程家长看护', tag: ' 技能学习', tagClass: 'baby' },
    { week: 3, text: '学习识别宝宝饥饿信号', desc: '早期信号：寻乳反射、吧唧嘴、吃手、伸舌头。哭是最后信号，不要等到哭才喂', tag: ' 知识学习', tagClass: 'skill' },

    // ═══ 产后第 4 周（week 4）═══
    { week: 4, text: '满月体检', desc: '测量体重（增长 600-1500g 正常）、身高（增长 3-5cm）、头围，评估发育情况', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 4, text: '开始记录生长曲线', desc: '每月记录体重、身高、头围数据，绘制生长曲线，关注百分比趋势而非单次数值', tag: ' 技能学习', tagClass: 'baby' },
    { week: 4, text: '产后恢复评估', desc: '检查子宫恢复（产后 4 周约缩小至孕 12 周大小）、伤口愈合、恶露情况', tag: ' 医疗事项', tagClass: 'mom' },
    { week: 4, text: '学习肠绞痛缓解方法', desc: '排气操（蹬自行车+顺时针揉肚子）、飞机抱、白噪音、襁褓包裹。黄昏哭闹常见', tag: ' 技能学习', tagClass: 'skill' },
    { week: 4, text: '宝宝奶量观察', desc: '3-4 周奶量增至 90-120ml/次，每天总奶量 500-700ml。按需喂养不强迫', tag: ' 知识学习', tagClass: 'baby' },
    { week: 4, text: '用黑白卡练追视', desc: '在宝宝面前 20-30cm 处缓慢移动黑白卡，每天 2-3 次，每次 1-2 分钟', tag: ' 技能学习', tagClass: 'baby' },

    // ═══ 产后第 5 周（week 5）═══
    { week: 5, text: '准备 42 天复查资料', desc: '整理出院小结、产检报告、宝宝出生证明、疫苗本、问题清单', tag: ' 医疗事项', tagClass: 'doc' },
    { week: 5, text: '开始凯格尔运动', desc: '产后 1 周可开始（排除感染/恶露过多）。收缩盆底肌 5 秒→放松 5 秒，每天 3 组每组 10 次', tag: ' 技能学习', tagClass: 'mom' },
    { week: 5, text: '观察宝宝发育里程碑', desc: '宝宝清醒时间延长至 3-4 小时，开始有意识微笑，能短暂追视人脸和黑白卡', tag: ' 知识学习', tagClass: 'baby' },
    { week: 5, text: '区分昼夜培养作息', desc: '白天保持明亮和活动，晚上昏暗安静。帮助宝宝建立昼夜节律', tag: ' 技能学习', tagClass: 'baby' },
    { week: 5, text: '宝宝开始发出"啊呜"声', desc: '多和宝宝面对面说话、唱歌，模仿宝宝发出的声音，促进语言发育', tag: ' 技能学习', tagClass: 'baby' },

    // ═══ 产后第 6 周（week 6）═══
    { week: 6, text: '产后 42 天复查（妈妈+宝宝）', desc: '妈妈：盆底肌评估（肌力＜3 级需治疗）、子宫 B 超、伤口检查。宝宝：全面体检+发育评估', tag: ' 医疗事项', tagClass: 'urgent' },
    { week: 6, text: '宝宝抬头训练', desc: '每天俯卧 2-3 次，每次 2-3 分钟。6 周宝宝能抬头 45° 左右，锻炼颈部肌肉', tag: ' 技能学习', tagClass: 'baby' },
    { week: 6, text: '宝宝接种疫苗（五联/肺炎/轮状）', desc: '2 月龄：五联第一针 / 13 价肺炎第一针 / 口服五价轮状疫苗（需在 12 周内完成第一剂）', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 6, text: '妈妈逐步恢复温和运动', desc: '散步、产后瑜伽。盆底肌未恢复前不跑步、不跳绳、不做仰卧起坐', tag: ' 技能学习', tagClass: 'mom' },
    { week: 6, text: '肠胀气高发期护理', desc: '坚持每天做排气操，喂奶前充分排气（奶瓶排气孔朝上），飞机抱安抚', tag: ' 技能学习', tagClass: 'baby' },
    { week: 6, text: '宝宝奶量增长至 120-150ml/次', desc: '总奶量 600-800ml/天，奶嘴从 SS 过渡到 S 号。母乳按需但不一哭就喂', tag: ' 知识学习', tagClass: 'baby' },

    // ═══ 产后第 7 周（week 7）═══
    { week: 7, text: '和宝宝互动游戏', desc: '黑白卡升级彩色卡追视、摇铃追听、和宝宝说话唱歌、照镜子', tag: ' 技能学习', tagClass: 'baby' },
    { week: 7, text: '了解宝宝睡眠规律', desc: '新生儿睡眠 16-18 小时/天，白天小睡 5-7 小时，夜间 8-10 小时（2-3 小时醒一次）', tag: ' 知识学习', tagClass: 'baby' },
    { week: 7, text: '妈妈营养补充不能停', desc: '哺乳期继续补钙 1000mg/天+维生素 D 400IU/天，保证奶水质量', tag: ' 知识学习', tagClass: 'mom' },
    { week: 7, text: '宝宝有意识微笑', desc: '宝宝开始对人的脸有反应，会主动微笑。多回应宝宝的笑容，这是社交发展的第一步', tag: ' 知识学习', tagClass: 'baby' },
    { week: 7, text: '识别宝宝不同哭声', desc: '饿了：急促"a"声、晃脑袋。困了：揉眼睛、打哈欠。胀气：烦躁哼哼、蹬腿。尿布湿：急躁扭动', tag: ' 技能学习', tagClass: 'skill' },

    // ═══ 产后第 8 周（week 8）═══
    { week: 8, text: '建立"吃-玩-睡"循环', desc: '顺序：喂奶→拍嗝→玩一会儿（俯卧/互动）→哄睡。避免吃着奶睡的习惯', tag: ' 技能学习', tagClass: 'baby' },
    { week: 8, text: '妈妈盆底肌康复评估', desc: '42 天复查后根据评估结果决定是否需要盆底康复治疗（电刺激+生物反馈）', tag: ' 医疗事项', tagClass: 'mom' },
    { week: 8, text: '准备宝宝 2 月龄用品', desc: '换 S 码尿不湿（NB 用完了）、买 59 码衣服、准备牙胶（开始口欲期）', tag: ' 物品准备', tagClass: 'baby' },
    { week: 8, text: '宝宝俯卧抬头 45-90°', desc: '2 个月宝宝俯卧能抬头至 45-90°，开始练抓握（摇铃、软胶玩具）', tag: ' 技能学习', tagClass: 'baby' },
    { week: 8, text: '使用襁褓应对惊跳反射', desc: '宝宝睡觉时惊跳反射明显，用襁褓包裹或投降式睡袋，提高睡眠质量', tag: ' 技能学习', tagClass: 'baby' },

    // ═══ 产后第 9 周（week 9）═══
    { week: 9, text: '宝宝疫苗第二针', desc: '五联/百白破第二针、13 价肺炎第二针、口服轮状第二剂。按时接种', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 9, text: '学习婴儿抚触手法', desc: '每天洗澡后做抚触：胸部→腹部→四肢→背部，用抚触油，每次 10-15 分钟', tag: ' 技能学习', tagClass: 'skill' },
    { week: 9, text: '关注宝宝情绪表达', desc: '宝宝开始对不同人有不同反应，对熟悉的人笑，对陌生人警惕。这是正常社交发育', tag: ' 知识学习', tagClass: 'baby' },
    { week: 9, text: '宝宝抓握能力发展', desc: '从无意识抓握到有意识抓握，给宝宝摇铃、软胶玩具，练习手眼协调', tag: ' 技能学习', tagClass: 'baby' },
    { week: 9, text: '妈妈腹式呼吸修复腹直肌', desc: '仰卧，鼻吸 4 秒（腹部鼓起），嘴呼 6 秒（腹部收紧）。每天 10 分钟，避免卷腹', tag: ' 技能学习', tagClass: 'mom' },

    // ═══ 产后第 10 周（week 10）═══
    { week: 10, text: '宝宝抓握训练升级', desc: '给不同材质的玩具（软胶、布书、摇铃），练习抓握和手眼协调', tag: ' 技能学习', tagClass: 'baby' },
    { week: 10, text: '妈妈腹直肌分离自测', desc: '平躺屈膝，抬头看肚脐，用手指摸腹中线。≥2 指需做修复，避免卷腹/平板支撑', tag: ' 知识学习', tagClass: 'mom' },
    { week: 10, text: '了解厌奶期', desc: '3 个月左右可能出现厌奶，表现为吃奶分心、奶量下降。应对：安静环境喂奶、增加运动消耗', tag: ' 知识学习', tagClass: 'baby' },
    { week: 10, text: '宝宝口欲期护理', desc: '宝宝开始吃手、啃咬玩具。不要阻止（口欲期正常），保持手部清洁，提供牙胶', tag: ' 知识学习', tagClass: 'baby' },
    { week: 10, text: '白天小睡规律化', desc: '2-3 个月白天小睡 3-4 次，每次 30 分钟-2 小时。抓住揉眼睛、打哈欠信号及时哄睡', tag: ' 技能学习', tagClass: 'baby' },

    // ═══ 产后第 11 周（week 11）═══
    { week: 11, text: '准备 3 月龄体检', desc: '提前预约体检，整理好喂养/睡眠/排泄记录和想问医生的问题', tag: ' 医疗事项', tagClass: 'doc' },
    { week: 11, text: '了解睡眠倒退期', desc: '3-4 个月可能出现睡眠倒退，夜醒增多。这是正常发育现象，保持耐心和规律作息', tag: ' 知识学习', tagClass: 'baby' },
    { week: 11, text: '妈妈回归职场准备', desc: '如需背奶：提前准备吸奶器、储奶袋、背奶包。规划育儿安排（托育/家人/保姆）', tag: ' 物品准备', tagClass: 'mom' },
    { week: 11, text: '宝宝语言发育', desc: '宝宝开始发出更多声音（啊、呜、哦），模仿大人的语调。多和宝宝对话、念儿歌', tag: ' 技能学习', tagClass: 'baby' },
    { week: 11, text: '减少夜奶次数', desc: '3 个月宝宝夜间可连续睡 5-6 小时，逐步减少夜奶次数，为睡整觉铺垫', tag: ' 技能学习', tagClass: 'baby' },

    // ═══ 产后第 12 周（week 12）═══
    { week: 12, text: '三个月体检（全面评估）', desc: '评估指标：俯卧抬头 90°、追视 180°、抓握能力、社交反应、体重身高头围', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 12, text: '宝宝疫苗第三针', desc: '五联/百白破第三针、13 价肺炎第三针、口服轮状第三剂', tag: ' 医疗事项', tagClass: 'baby' },
    { week: 12, text: '宝宝翻身准备训练', desc: '多趴着玩增强核心力量，用玩具引导翻身（仰卧→侧卧→俯卧），全程看护', tag: ' 技能学习', tagClass: 'baby' },
    { week: 12, text: '回顾产后 3 个月恢复情况', desc: '评估：体重恢复、盆底肌力、腹直肌分离、情绪状态。如有问题及时咨询医生', tag: ' 知识学习', tagClass: 'mom' },
    { week: 12, text: '建立稳定"吃-玩-睡"模式', desc: '白天间隔 3-4 小时喂奶，建立睡前仪式（洗澡→抚触→喂奶→哄睡），夜奶 2-3 次', tag: ' 技能学习', tagClass: 'baby' },
    { week: 12, text: '准备宝宝翻身期安全措施', desc: '床栏加固、地面铺爬行垫、收起周围危险物品、永远不要单独留宝宝在大床上', tag: ' 物品准备', tagClass: 'baby' },
  ];

  // ─── DOM refs ───
  const dueDateInput = document.getElementById('due-date');
  const setBtn = document.getElementById('set-date-btn');
  const resetBtn = document.getElementById('reset-btn');
  const stageBanner = document.getElementById('stage-banner');
  const stageName = document.getElementById('stage-name');
  const stageDetail = document.getElementById('stage-detail');
  const stageProgress = document.getElementById('stage-progress');
  const overallProgress = document.getElementById('overall-progress');
  const taskSection = document.getElementById('task-section');
  const taskContainer = document.getElementById('task-container');
  const emptySection = document.getElementById('empty-section');

  // ─── 工具函数 ───
  function weeksBetween(d1, d2) {
    const diff = d2.getTime() - d1.getTime();
    return Math.round(diff / (7 * 24 * 60 * 60 * 1000));
  }

  function formatDate(date) {
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  }

  // ─── 获取当前阶段信息 ───
  function getStageInfo(dueDateStr) {
    const today = new Date();
    today.setHours(0,0,0,0);
    const dueDate = new Date(dueDateStr);
    dueDate.setHours(0,0,0,0);

    const weeksToDue = weeksBetween(today, dueDate);

    if (weeksToDue > 12) {
      return {
        stage: 'early',
        label: ' 孕早期/中期',
        detail: `距离预产期还有 ${weeksToDue} 周，还不到使用时间`,
        progress: '',
        currentWeek: null,
        allWeeks: []
      };
    } else if (weeksToDue >= 0) {
      // 孕晚期：显示所有周 -12 到 0
      const gw = 40 - weeksToDue;
      const allWeeks = [];
      for (let w = -12; w <= 0; w++) allWeeks.push(w);
      return {
        stage: 'prenatal',
        label: ` 孕晚期 · 孕 ${gw} 周`,
        detail: `距离预产期还有 ${weeksToDue} 周`,
        progress: `孕 ${gw} 周 / 40 周`,
        currentWeek: -weeksToDue,
        allWeeks
      };
    } else {
      // 产后：显示所有周 1 到 12
      const weeksAfter = Math.abs(weeksToDue);
      const allWeeks = [];
      for (let w = 1; w <= 12; w++) allWeeks.push(w);
      return {
        stage: 'postpartum',
        label: ` 产后 · 第 ${weeksAfter} 周`,
        detail: `宝宝出生 ${weeksAfter} 周了`,
        progress: `产后第 ${Math.min(weeksAfter, 12)} 周 / 12 周`,
        currentWeek: weeksAfter,
        allWeeks
      };
    }
  }

  function weekLabel(week) {
    if (week < 0) return `孕 ${40 + week} 周`;
    if (week === 0) return ' 预产期';
    return `产后第 ${week} 周`;
  }

  function weekStatus(week, currentWeek) {
    if (currentWeek === null) return '';
    if (week < currentWeek) return '✅ 已完成区域';
    if (week === currentWeek) return ' 当前阶段';
    return ' 即将到来';
  }

  function isCurrentWeek(week, currentWeek) {
    return currentWeek !== null && week === currentWeek;
  }

  // ─── 渲染 ───
  function render() {
    const saved = localStorage.getItem('nestguide_due_date');
    if (!saved) {
      stageBanner.style.display = 'none';
      overallProgress.style.display = 'none';
      taskSection.style.display = 'none';
      emptySection.style.display = 'block';
      document.querySelector('.empty-state h3').textContent = ' 请设置您的预产期';
      document.querySelector('.empty-state p').innerHTML = '选择日期后，系统会根据您当前所处的阶段<br>展示从孕 28 周到产后 12 周的完整待办清单';
      return;
    }

    dueDateInput.value = saved;
    const info = getStageInfo(saved);

    // 更新 banner
    stageBanner.style.display = 'flex';
    stageName.textContent = info.label;
    stageDetail.textContent = info.detail;
    stageProgress.textContent = info.progress || '';

    if (info.stage === 'early') {
      overallProgress.style.display = 'none';
      taskSection.style.display = 'none';
      emptySection.style.display = 'block';
      document.querySelector('.empty-state h3').textContent = ' 还不到使用时间哦';
      document.querySelector('.empty-state p').innerHTML = info.detail;
      return;
    }

    emptySection.style.display = 'none';
    taskSection.style.display = 'block';

    // 计算统计数据
    const allVisibleTasks = TASK_DB.filter(t => info.allWeeks.includes(t.week));
    // 只显示当前周及之前已完成的任务，加上未来所有任务
    const displayTasks = allVisibleTasks.filter(t => {
      if (info.currentWeek === null) return true;
      return t.week <= info.currentWeek;
    });
    // 但也要显示未来2周的任务（给用户预览）
    const previewTasks = allVisibleTasks.filter(t => {
      if (info.currentWeek === null) return false;
      return t.week > info.currentWeek && t.week <= info.currentWeek + 2;
    });

    const visibleTasks = [...displayTasks, ...previewTasks];

    // 统计总任务数（所有可见周）
    const totalCount = allVisibleTasks.length;
    let doneCount = 0;
    allVisibleTasks.forEach(t => {
      const key = 'task_' + encodeURIComponent(t.text + '_' + t.week);
      if (localStorage.getItem(key) === 'true') doneCount++;
    });
    const pendingCount = totalCount - doneCount;
    const rate = totalCount > 0 ? Math.round(doneCount / totalCount * 100) : 0;

    document.getElementById('stat-total').textContent = totalCount;
    document.getElementById('stat-done').textContent = doneCount;
    document.getElementById('stat-pending').textContent = pendingCount;
    document.getElementById('stat-rate').textContent = rate + '%';
    document.getElementById('stat-weeks').textContent = info.allWeeks.length;
    overallProgress.style.display = 'block';

    // 按周分组渲染
    let html = '';
    info.allWeeks.forEach(week => {
      const tasks = allVisibleTasks.filter(t => t.week === week);
      if (tasks.length === 0) return;

      let doneInWeek = 0;
      let taskHtml = '';
      tasks.forEach(t => {
        const key = 'task_' + encodeURIComponent(t.text + '_' + t.week);
        const done = localStorage.getItem(key) === 'true';
        if (done) doneInWeek++;
        taskHtml += `
          <div class="task-item${done ? ' done' : ''}" data-key="${key}">
            <div class="task-check">${done ? '✓' : ''}</div>
            <div class="task-content">
              <div class="task-text">${t.text}</div>
              <div class="task-desc">${t.desc}</div>
            </div>
            <span class="task-tag ${t.tagClass}">${t.tag}</span>
          </div>
        `;
      });

      const current = isCurrentWeek(week, info.currentWeek);
      const status = weekStatus(week, info.currentWeek);
      // 如果当前周还没到，但很近（2周内），显示为"即将到来"
      // 如果当前周已经过了，显示"已完成区域"
      // 如果距离当前周超过2周，显示"未来任务"
      let statusClass = '';
      let statusText = status;
      if (info.currentWeek !== null) {
        if (week < info.currentWeek) {
          statusText = '✅ 已完成';
        } else if (week === info.currentWeek) {
          statusText = ' 当前阶段';
          statusClass = 'current';
        } else if (week <= info.currentWeek + 2) {
          statusText = ' 即将到来';
        } else {
          statusText = ' 未来任务';
        }
      }

      html += `
        <div class="task-group">
          <div class="task-group-header">
            <span class="week-icon">${current ? '  ' : ''}</span>
            <span class="week-label">${weekLabel(week)}</span>
            <span class="week-status ${statusClass}">${statusText}</span>
            <span class="week-progress">${doneInWeek}/${tasks.length}</span>
          </div>
          <div class="task-card">${taskHtml}</div>
        </div>
      `;
    });

    taskContainer.innerHTML = html;

    // 绑定点击事件
    document.querySelectorAll('.task-item').forEach(el => {
      el.addEventListener('click', function() {
        const key = this.dataset.key;
        const done = localStorage.getItem(key) === 'true';
        localStorage.setItem(key, done ? 'false' : 'true');
        render();
      });
    });
  }

  // ─── 事件绑定 ───
  setBtn.addEventListener('click', () => {
    const val = dueDateInput.value;
    if (!val) { alert('请选择预产期或宝宝出生日期'); return; }
    localStorage.setItem('nestguide_due_date', val);
    render();
  });

  resetBtn.addEventListener('click', () => {
    if (!confirm('重置将清除所有已勾选的任务，确定吗？')) return;
    localStorage.removeItem('nestguide_due_date');
    const keys = Object.keys(localStorage);
    keys.forEach(k => { if (k.startsWith('task_')) localStorage.removeItem(k); });
    render();
  });

  // ─── 初始化 ───
  const defaultDate = new Date();
  defaultDate.setDate(defaultDate.getDate() + 12 * 7);
  dueDateInput.value = formatDate(defaultDate);

  if (localStorage.getItem('nestguide_due_date')) {
    render();
  }
})();
</script>
</body>
</html>
